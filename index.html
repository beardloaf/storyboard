  // --- API calls ---
  async function callBflFlux(prompt) {
    const cinePrompt = `Cinematic film still, anamorphic widescreen, 35mm film grain, natural lighting, shallow depth of field, color graded, photorealistic, atmospheric. ${prompt}`;
    if (!settings.bflProxyUrl) {
      throw new Error("Set BFL Proxy URL in ⚙ API keys — BFL blocks browser calls so a Cloudflare Worker proxy is required. See bfl-proxy.worker.js in the repo for the code and deploy steps.");
    }
    const base = settings.bflProxyUrl.replace(/\/+$/, "");
    const url = `${base}/v1/${settings.bflModel}`;
    const body = settings.bflModel.includes("ultra")
      ? { prompt: cinePrompt, aspect_ratio: "16:9", prompt_upsampling: true, safety_tolerance: 2, output_format: "jpeg", raw: false }
      : { prompt: cinePrompt, width: 1024, height: 576, prompt_upsampling: true, safety_tolerance: 2, output_format: "jpeg" };
    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-key": settings.bflKey, "accept": "application/json" },
        body: JSON.stringify(body)
      });
    } catch (e) {
      throw new Error(`Network error reaching proxy ${base} — check the URL is correct and the Worker is deployed. (${e.message})`);
    }
    if (!res.ok) { const t = await res.text(); throw new Error(`BFL ${res.status}: ${t.slice(0,300)}`); }
    const job = await res.json();
    const pollUrl = job.polling_url || `${base}/v1/get_result?id=${job.id}`;
    const deadline = Date.now() + 120000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 1200));
      let pr;
      try {
        pr = await fetch(pollUrl, { headers: { "x-key": settings.bflKey, "accept": "application/json" } });
      } catch (e) {
        throw new Error(`Network error polling proxy. (${e.message})`);
      }
      if (!pr.ok) { const t = await pr.text(); throw new Error(`BFL poll ${pr.status}: ${t.slice(0,200)}`); }
      const pj = await pr.json();
      if (pj.status === "Ready" && pj.result && pj.result.sample) return pj.result.sample;
      if (pj.status && /error|failed|content_moderated/i.test(pj.status)) {
        throw new Error(`BFL: ${pj.status}${pj.details ? " — " + JSON.stringify(pj.details) : ""}`);
      }
    }
    throw new Error("BFL timed out");
  }

  async function callElevenLabs(text) {
    const url = `https://api.elevenlabs.io/v1/text-to-speech/${settings.voiceId}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "xi-api-key": settings.elevenKey, "Accept": "audio/mpeg" },
      body: JSON.stringify({
        text, model_id: "eleven_multilingual_v2",
        // stability low → less monotone; style high → more emotion. Trade-off: occasional artifacts.
        voice_settings: { stability: 0.35, similarity_boost: 0.75, style: 0.5, use_speaker_boost: true }
      })
    });
    if (!res.ok) { const t = await res.text(); throw new Error(`ElevenLabs TTS ${res.status}: ${t.slice(0,300)}`); }
    return res.blob();
  }

  async function callElevenLabsMusic(prompt, lengthMs) {
    // ElevenLabs Music endpoint
    const url = `https://api.elevenlabs.io/v1/music`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "xi-api-key": settings.elevenKey, "Accept": "audio/mpeg" },
      body: JSON.stringify({ prompt, music_length_ms: lengthMs })
    });
    if (!res.ok) {
      const t = await res.text();
      // Fallback to legacy endpoint name if first fails
      if (res.status === 404) {
        const res2 = await fetch(`https://api.elevenlabs.io/v1/music/compose`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "xi-api-key": settings.elevenKey, "Accept": "audio/mpeg" },
          body: JSON.stringify({ prompt, music_length_ms: lengthMs })
        });
        if (!res2.ok) { const t2 = await res2.text(); throw new Error(`ElevenLabs Music ${res2.status}: ${t2.slice(0,300)}`); }
        return res2.blob();
      }
      throw new Error(`ElevenLabs Music ${res.status}: ${t.slice(0,300)}`);
    }
    return res.blob();
  }

  // --- frame generation handlers ---
  function triggerImageUpload(frameIdx) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*,video/*";
    input.style.display = "none";
    document.body.appendChild(input);
    input.onchange = async () => {
      const file = input.files && input.files[0];
      input.remove();
      if (!file) return;
      await handleImageUpload(frameIdx, file);
    };
    input.click();
  }

  async function handleImageUpload(i, file) {
    const doc = activeDoc();
    const f = doc.frames[i];
    const preview = document.querySelector(`[data-img="${i}"]`);
    if (preview) preview.classList.add("loading");
    try {
      const isVideo = file.type.startsWith("video/");
      let blob, type, prefix;
      if (isVideo) {
        // Videos stored as-is; no canvas compression
        blob = file;
        type = file.type || "video/mp4";
        prefix = "vid-upload";
      } else {
        const objUrl = URL.createObjectURL(file);
        blob = await urlToCompressedBlob(objUrl, 1280, 0.9);
        URL.revokeObjectURL(objUrl);
        type = "image/jpeg";
        prefix = "img-upload";
      }
      const key = newKey(prefix);
      await idbPut(key, blob);
      if (!Array.isArray(f.imageHistory)) f.imageHistory = [];
      if (!f.mediaTypes || typeof f.mediaTypes !== "object") f.mediaTypes = {};
      f.imageHistory.push(key);
      f.mediaTypes[key] = type;
      f.imageKey = key;
      save();
      updateFrameImage(i);
    } catch (e) {
      console.error(e);
      alert("Upload failed: " + e.message);
    } finally {
      if (preview) preview.classList.remove("loading");
    }
  }

  async function handleGenerateImage(i, btn) {
    const doc = activeDoc();
    const f = doc.frames[i];
    if (!f.description.trim()) { alert("Write a description first."); return; }
    if (!settings.bflKey) { alert("Add your BFL API key in settings (⚙)."); showSettings(); return; }
    if (btn) btn.disabled = true;
    const preview = document.querySelector(`[data-img="${i}"]`);
    preview.classList.add("loading");

    // Run BFL generation and TMDb stills search in parallel
    const bflTask = (async () => {
      const imgUrl = await callBflFlux(f.description);
      const blob = await urlToCompressedBlob(imgUrl, 1280, 0.85);
      const key = newKey("img");
      await idbPut(key, blob);
      return key;
    })();

    const stillsTask = (async () => {
      const urls = await searchMovieStills(f.description, 3);
      const keys = [];
      for (const url of urls) {
        try {
          const src = await fetchImageWithFallback(url);
          const blob = await blobToCompressedBlob(src, 1280, 0.85);
          const key = newKey("img-still");
          await idbPut(key, blob);
          keys.push(key);
        } catch (e) {
          console.warn("still download skipped", url, e);
        }
      }
      return keys;
    })();

    const [bflRes, stillsRes] = await Promise.allSettled([bflTask, stillsTask]);

    try {
      if (!Array.isArray(f.imageHistory)) f.imageHistory = [];
      if (!f.mediaTypes || typeof f.mediaTypes !== "object") f.mediaTypes = {};

      let primaryKey = null;
      if (bflRes.status === "fulfilled") {
        const key = bflRes.value;
        f.imageHistory.push(key);
        f.mediaTypes[key] = "image/jpeg";
        primaryKey = key;
      }
      if (stillsRes.status === "fulfilled") {
        for (const key of stillsRes.value) {
          f.imageHistory.push(key);
          f.mediaTypes[key] = "image/jpeg";
          if (!primaryKey) primaryKey = key;
        }
      }

      if (primaryKey) {
        f.imageKey = primaryKey;
        save();
        preview.innerHTML = frameImageHtml(f);
        hydrateImages(preview);
      } else {
        const msg = bflRes.status === "rejected" ? bflRes.reason && bflRes.reason.message : "Generation failed.";
        alert("Image generation failed: " + msg);
      }
    } finally {
      preview.classList.remove("loading");
      if (btn) btn.disabled = false;
    }
  }
  async function handleGenerateVoice(i, btn) {
    const doc = activeDoc();
    const f = doc.frames[i];
    if (!f.subtitle.trim()) { alert("Write voiceover text first."); return; }
    if (!settings.elevenKey) { alert("Add your ElevenLabs API key in settings (⚙)."); showSettings(); return; }
    btn.disabled = true;
    const preview = document.querySelector(`[data-wave="${i}"]`);
    preview.classList.add("loading");
    try {
      const blob = await callElevenLabs(f.subtitle);
      const { peaks, duration } = await computeWaveform(blob, 96);
      if (f.audioKey) idbDel(f.audioKey).catch(()=>{});
      const key = newKey("audio");
      await idbPut(key, blob);
      f.audioKey = key; f.wave = peaks;
      f.duration = Math.round(duration * 100) / 100;
      save(); renderEditor();
    } catch (e) {
      console.error(e); alert("Voice generation failed: " + e.message);
    } finally {
      preview.classList.remove("loading");
      btn.disabled = false;
    }
  }

  // --- player ---
  const playerEl = document.getElementById("player");
  const playerDesc = document.getElementById("playerDesc");
  const playerSub = document.getElementById("playerSub");
  const playerFrameNo = document.getElementById("playerFrameNo");
  const playerImgStage = document.getElementById("playerImgStage");
  const playerAudio = document.getElementById("playerAudio");
  const playerMusic = document.getElementById("playerMusic");
  const playerVideo = document.getElementById("playerVideo");
  const progressBar = document.getElementById("progressBar");
  const timeReadout = document.getElementById("timeReadout");
  const playPauseBtn = document.getElementById("playPauseBtn");

  let playState = { playing:false, idx:0, startedAt:0, elapsedInFrame:0, rafId:null };

  function frames() { return activeDoc().frames; }
  function totalLength() { return frames().reduce((s,f)=>s+f.duration, 0); }
  function elapsedBeforeIdx(idx) { let s=0; for (let i=0;i<idx;i++) s+=frames()[i].duration; return s; }

  async function showFrame(i) {
    const f = frames()[i]; if (!f) return;
    const type = f.imageKey ? mediaTypeFor(f, f.imageKey) : "";
    const isVideo = isVideoType(type);
    if (f.imageKey) {
      const url = await blobUrl(f.imageKey);
      if (isVideo) {
        playerImgStage.style.backgroundImage = "";
        playerImgStage.classList.add("has-video");
        if (url) { playerVideo.src = url; playerVideo.currentTime = 0; playerVideo.play().catch(()=>{}); }
      } else {
        playerImgStage.classList.remove("has-video");
        playerVideo.pause(); playerVideo.removeAttribute("src");
        if (url) playerImgStage.style.backgroundImage = `url("${url}")`;
      }
      playerDesc.classList.remove("fallback");
      playerDesc.style.display = "none";
    } else {
      playerImgStage.style.backgroundImage = "";
      playerImgStage.classList.remove("has-video");
      playerVideo.pause(); playerVideo.removeAttribute("src");
      playerDesc.classList.add("fallback");
      playerDesc.textContent = f.description || "(no description)";
      playerDesc.style.display = "";
    }
    playerSub.textContent = f.subtitle || "";
    playerSub.style.display = f.subtitle ? "" : "none";
    playerFrameNo.textContent = `FRAME ${i+1} / ${frames().length}`;
    if (f.audioKey) {
      const url = await blobUrl(f.audioKey);
      playerAudio.src = url; playerAudio.currentTime = 0;
      if (playState.playing) playerAudio.play().catch(()=>{});
    } else {
      playerAudio.removeAttribute("src");
    }
  }

  async function startPlayer() {
    if (frames().length === 0) return;
    playerEl.style.display = "flex";
    playState = { playing:true, idx:0, startedAt:performance.now(), elapsedInFrame:0, rafId:null };
    const doc = activeDoc();
    if (doc.musicKey) {
      const url = await blobUrl(doc.musicKey);
      playerMusic.src = url; playerMusic.volume = 0.45;
      playerMusic.currentTime = 0; playerMusic.play().catch(()=>{});
    } else { playerMusic.removeAttribute("src"); }
    showFrame(0); playPauseBtn.textContent = "⏸ Pause"; tick();
  }
  function stopPlayer() {
    playState.playing = false; cancelAnimationFrame(playState.rafId);
    playerAudio.pause(); playerMusic.pause(); playerVideo.pause();
    playerEl.style.display = "none";
  }
  function pause() {
    if (!playState.playing) return;
    playState.elapsedInFrame += (performance.now() - playState.startedAt) / 1000;
    playState.playing = false; cancelAnimationFrame(playState.rafId);
    playerAudio.pause(); playerMusic.pause(); playerVideo.pause();
    playPauseBtn.textContent = "▶ Play";
  }
  function resume() {
    if (playState.playing) return;
    playState.playing = true; playState.startedAt = performance.now();
    if (playerAudio.src) playerAudio.play().catch(()=>{});
    if (playerMusic.src) playerMusic.play().catch(()=>{});
    if (playerVideo.src) playerVideo.play().catch(()=>{});
    playPauseBtn.textContent = "⏸ Pause"; tick();
  }
  function gotoFrame(i) {
    if (i < 0 || i >= frames().length) return;
    playState.idx = i; playState.elapsedInFrame = 0; playState.startedAt = performance.now();
    showFrame(i);
  }
  function tick() {
    if (!playState.playing) return;
    const f = frames()[playState.idx];
    const hasAudio = !!(f.audioKey && playerAudio.src && isFinite(playerAudio.duration) && playerAudio.duration > 0);
    let inFrame, frameDur;
    if (hasAudio) {
      inFrame = playerAudio.currentTime;
      frameDur = playerAudio.duration;
    } else {
      const now = performance.now();
      inFrame = playState.elapsedInFrame + (now - playState.startedAt) / 1000;
      frameDur = f.duration;
    }
    const total = totalLength();
    const overall = elapsedBeforeIdx(playState.idx) + Math.min(inFrame, frameDur);
    progressBar.style.width = `${(overall/total)*100}%`;
    timeReadout.textContent = `${overall.toFixed(1)}s / ${total.toFixed(1)}s`;
    if (inFrame >= frameDur) {
      if (playState.idx >= frames().length - 1) {
        progressBar.style.width = "100%"; playState.playing = false;
        playerAudio.pause(); playerMusic.pause(); playerVideo.pause();
        playPauseBtn.textContent = "↻ Replay"; return;
      }
      playState.idx += 1; playState.elapsedInFrame = 0; playState.startedAt = performance.now();
      showFrame(playState.idx);
    }
    playState.rafId = requestAnimationFrame(tick);
  }

  document.getElementById("playBtn").addEventListener("click", startPlayer);
  document.getElementById("closeBtn").addEventListener("click", stopPlayer);
  document.getElementById("prevBtn").addEventListener("click", () => gotoFrame(playState.idx - 1));
  document.getElementById("nextBtn").addEventListener("click", () => gotoFrame(playState.idx + 1));
  playPauseBtn.addEventListener("click", () => {
    if (playPauseBtn.textContent.startsWith("↻")) { startPlayer(); return; }
    playState.playing ? pause() : resume();
  });
  document.addEventListener("keydown", (e) => {
    if (playerEl.style.display === "none") return;
    if (e.key === "Escape") stopPlayer();
    if (e.key === " ") { e.preventDefault(); playPauseBtn.click(); }
    if (e.key === "ArrowRight") gotoFrame(playState.idx + 1);
    if (e.key === "ArrowLeft") gotoFrame(playState.idx - 1);
  });

  // Editor hotkeys
  document.addEventListener("keydown", (e) => {
    if (playerEl.style.display !== "none") return; // player has its own shortcuts
    // Cmd+Enter (Mac) / Ctrl+Enter — add a new frame, even from inside a textarea
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      const addBtn = document.getElementById("addFrame");
      if (addBtn) {
        addBtn.click();
        // After re-render, scroll the newest frame into view + focus its description
        requestAnimationFrame(() => {
          const lastFrame = framesEl.lastElementChild;
          if (lastFrame) {
            lastFrame.scrollIntoView({ behavior: "smooth", block: "center" });
            const ta = lastFrame.querySelector('textarea[data-k="description"]');
            if (ta) ta.focus();
          }
        });
      }
    }
  });

  // --- Share link (GitHub-backed) ---
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const s = String(r.result);
        const idx = s.indexOf(",");
        resolve(idx >= 0 ? s.slice(idx + 1) : s);
      };
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  async function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result));
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  function dataUrlToBlobSync(dataUrl) {
    const m = /^data:([^;]+);base64,(.+)$/.exec(dataUrl);
    if (!m) return null;
    const type = m[1];
    const b64 = m[2];
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type });
  }
  function randomSlug() {
    return Math.random().toString(36).slice(2, 6) + Math.random().toString(36).slice(2, 6);
  }

  async function bundleStoryboardForShare() {
    const doc = activeDoc();
    const frames = [];
    for (const f of doc.frames) {
      let imageDataUrl = null, imageType = null;
      if (f.imageKey) {
        const blob = await idbGet(f.imageKey);
        if (blob) {
          imageDataUrl = await blobToDataUrl(blob);
          imageType = mediaTypeFor(f, f.imageKey);
        }
      }
      let audioDataUrl = null;
      if (f.audioKey) {
        const blob = await idbGet(f.audioKey);
        if (blob) audioDataUrl = await blobToDataUrl(blob);
      }
      frames.push({
        description: f.description || "",
        subtitle: f.subtitle || "",
        duration: f.duration,
        wave: f.wave || [],
        image: imageDataUrl, imageType,
        audio: audioDataUrl
      });
    }
    let musicDataUrl = null;
    if (doc.musicKey) {
      const blob = await idbGet(doc.musicKey);
      if (blob) musicDataUrl = await blobToDataUrl(blob);
    }
    return {
      version: 1,
      name: store.active,
      createdAt: new Date().toISOString(),
      music: musicDataUrl,
      frames
    };
  }

  function utf8ToBase64(str) {
    // GitHub Contents API requires base64-encoded content
    return btoa(unescape(encodeURIComponent(str)));
  }

  // --- Web Crypto helpers (password-protected shares) ---
  function bytesToBase64(bytes) {
    const arr = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    let bin = "";
    const chunk = 0x8000;
    for (let i = 0; i < arr.length; i += chunk) {
      bin += String.fromCharCode.apply(null, arr.subarray(i, i + chunk));
    }
    return btoa(bin);
  }
  function base64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  async function deriveKey(password, salt) {
    const km = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password),
      { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" },
      km,
      { name: "AES-GCM", length: 256 },
      false, ["encrypt", "decrypt"]
    );
  }
  async function encryptForShare(plaintextJsonString, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const ct = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv },
      key,
      new TextEncoder().encode(plaintextJsonString)
    );
    return {
      encrypted: true,
      version: 1,
      kdf: { name: "PBKDF2", iterations: 200000, hash: "SHA-256" },
      cipher: "AES-GCM",
      salt: bytesToBase64(salt),
      iv: bytesToBase64(iv),
      ciphertext: bytesToBase64(new Uint8Array(ct))
    };
  }
  async function decryptShare(env, password) {
    const salt = base64ToBytes(env.salt);
    const iv = base64ToBytes(env.iv);
    const ciphertext = base64ToBytes(env.ciphertext);
    const key = await deriveKey(password, salt);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function uploadShare() {
    if (!settings.githubToken) { alert("Add a GitHub PAT in ⚙ API keys (needs repo:contents write)."); showSettings(); return; }
    if (!settings.githubRepo || !settings.githubRepo.includes("/")) {
      alert("Set the share repo (owner/name) in ⚙ API keys."); showSettings(); return;
    }
    const password = await askSharePassword();
    if (password === null) return; // cancelled
    const slug = randomSlug();
    const status = showExportStatus("Bundling storyboard…");
    try {
      updateExportStatus(status, "Bundling assets…", 10);
      const bundle = await bundleStoryboardForShare();
      let payload, payloadLabel;
      if (password) {
        updateExportStatus(status, "Encrypting…", 35);
        const env = await encryptForShare(JSON.stringify(bundle), password);
        payload = JSON.stringify(env);
        payloadLabel = "encrypted";
      } else {
        payload = JSON.stringify(bundle);
        payloadLabel = "unencrypted";
      }
      updateExportStatus(status, `Uploading ${(payload.length / 1024).toFixed(0)} KB to GitHub…`, 65);
      const apiUrl = `https://api.github.com/repos/${settings.githubRepo}/contents/shares/${slug}.json`;
      const res = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${settings.githubToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `share: ${store.active} (${slug}, ${payloadLabel})`,
          content: utf8ToBase64(payload)
        })
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(`GitHub ${res.status}: ${t.slice(0, 300)}`);
      }
      const shareUrl = `${location.origin}${location.pathname}?share=${slug}`;
      updateExportStatus(status, "Done", 100);
      setTimeout(hideExportStatus, 600);
      showShareLinkModal(shareUrl, password);
    } catch (e) {
      console.error(e);
      hideExportStatus();
      alert("Share failed: " + e.message);
    }
  }

  function askSharePassword() {
    return new Promise((resolve) => {
      showModal(`
        <h3>Create share link</h3>
        <p>Leave the password blank for an open link. With a password, the bundle is encrypted in GitHub (AES-GCM, PBKDF2/200k); only people with the password can decrypt and view it.</p>
        <label>Password (optional)</label>
        <input id="sharePw" type="text" autocomplete="off" placeholder="e.g. sunset-walks" />
        <div class="actions">
          <button class="btn ghost" id="modalCancel">Cancel</button>
          <button class="btn primary" id="modalOk">Create link</button>
        </div>`);
      const input = document.getElementById("sharePw");
      setTimeout(() => input.focus(), 10);
      const done = (v) => { hideModal(); resolve(v); };
      document.getElementById("modalOk").addEventListener("click", () => done(input.value));
      document.getElementById("modalCancel").addEventListener("click", () => done(null));
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") done(input.value);
        if (e.key === "Escape") done(null);
      });
    });
  }

  function showShareLinkModal(url, password) {
    const pwBlock = password
      ? `<label>Password</label>
         <input type="text" readonly value="${escapeHtml(password)}" />
         <p style="margin-top:6px;font-size:11px;color:var(--muted)">Send this password separately. Without it the link is useless — the bundle on GitHub is encrypted.</p>`
      : `<p style="margin-top:6px;font-size:11px;color:var(--muted)">No password set — anyone with this link can watch.</p>`;
    showModal(`
      <h3>Shareable link</h3>
      <p>Watch-only access. Recipients can't edit it.</p>
      <label>URL</label>
      <input id="shareUrl" type="text" readonly value="${escapeHtml(url)}" />
      ${pwBlock}
      <div class="actions">
        <button class="btn ghost" id="modalCancel">Close</button>
        <button class="btn primary" id="modalOk">Copy link</button>
      </div>`);
    const input = document.getElementById("shareUrl");
    setTimeout(() => { input.focus(); input.select(); }, 10);
    document.getElementById("modalOk").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(url); document.getElementById("modalOk").textContent = "Copied ✓"; }
      catch { input.select(); document.execCommand("copy"); }
    });
    document.getElementById("modalCancel").addEventListener("click", hideModal);
  }
  document.getElementById("shareBtn").addEventListener("click", uploadShare);

  // --- Share-mode view (recipient side) ---
  function promptAndDecryptShare(env) {
    return new Promise((resolve) => {
      const render = (errorMsg) => {
        document.body.innerHTML = `
          <div class="share-view">
            <div class="brand"><img src="elmo-fire.gif" alt="elmo" onerror="this.style.display='none'"></div>
            <h1>🔒 Password required</h1>
            <div class="meta">This storyboard is encrypted</div>
            <div style="display:flex;flex-direction:column;gap:10px;width:min(360px,90vw);margin-top:8px">
              <input id="shareUnlockPw" type="password" placeholder="Password" autocomplete="off"
                style="text-align:center;padding:14px 18px;font-size:15px" />
              <button class="btn primary" id="shareUnlockBtn" style="padding:14px 20px">Unlock</button>
              ${errorMsg ? `<div style="color:var(--danger);font-family:var(--mono);font-size:11px;letter-spacing:.5px">${escapeHtml(errorMsg)}</div>` : ""}
            </div>
            <div class="footer">Made with <a href="${location.origin}${location.pathname}" target="_blank">storyboard</a></div>
          </div>`;
        const input = document.getElementById("shareUnlockPw");
        const btn = document.getElementById("shareUnlockBtn");
        setTimeout(() => input.focus(), 10);
        const tryUnlock = async () => {
          const pw = input.value;
          if (!pw) { render("Enter a password."); return; }
          btn.disabled = true; btn.textContent = "Unlocking…";
          try {
            const decoded = await decryptShare(env, pw);
            resolve(decoded);
          } catch (e) {
            console.warn("decrypt failed", e);
            render("Wrong password. Try again.");
          }
        };
        btn.addEventListener("click", tryUnlock);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
      };
      render("");
    });
  }

  async function loadSharedBundle(slug) {
    const repo = settings.githubRepo || "beardloaf/storyboard";
    // Try raw.githubusercontent first (instant after commit); fall back to Pages.
    const candidates = [
      `https://raw.githubusercontent.com/${repo}/main/shares/${slug}.json`,
      `${location.origin}${location.pathname.replace(/[^/]*$/, "")}shares/${slug}.json`
    ];
    let bundle = null, lastErr = null;
    for (const u of candidates) {
      try {
        const res = await fetch(u, { cache: "no-store" });
        if (res.ok) { bundle = await res.json(); break; }
        lastErr = new Error(`${res.status} from ${u}`);
      } catch (e) { lastErr = e; }
    }
    if (!bundle) throw lastErr || new Error("Could not load share");
    return bundle;
  }

  async function enterShareMode(slug) {
    document.body.innerHTML = `
      <div class="share-view">
        <div class="brand"><img src="elmo-fire.gif" alt="elmo" onerror="this.style.display='none'"></div>
        <div class="share-loading">Loading storyboard…</div>
      </div>`;
    let raw;
    try {
      raw = await loadSharedBundle(slug);
    } catch (e) {
      document.body.innerHTML = `
        <div class="share-view">
          <h1>Storyboard not found</h1>
          <p class="meta">${escapeHtml(e.message)}</p>
          <a href="${location.origin}${location.pathname}" class="btn">Open the editor</a>
        </div>`;
      return;
    }
    let bundle = raw;
    if (raw && raw.encrypted) {
      bundle = await promptAndDecryptShare(raw);
      if (!bundle) return; // user gave up
    }
    // Build a doc in memory; convert base64 assets back to blobs and stash them
    // in IDB under share-prefixed keys so the existing player code Just Works.
    const doc = { totalSec: 0, frameSec: 5, musicPrompt: "", musicKey: "", frames: [] };
    if (bundle.music) {
      const blob = dataUrlToBlobSync(bundle.music);
      if (blob) {
        const key = `share-${slug}-music`;
        await idbPut(key, blob);
        doc.musicKey = key;
      }
    }
    for (let i = 0; i < bundle.frames.length; i++) {
      const fb = bundle.frames[i];
      const f = {
        description: fb.description || "",
        subtitle: fb.subtitle || "",
        duration: fb.duration || 5,
        wave: fb.wave || [],
        imageKey: "", imageHistory: [], mediaTypes: {},
        audioKey: ""
      };
      if (fb.image) {
        const blob = dataUrlToBlobSync(fb.image);
        if (blob) {
          const key = `share-${slug}-img-${i}`;
          await idbPut(key, blob);
          f.imageKey = key;
          f.imageHistory.push(key);
          f.mediaTypes[key] = fb.imageType || blob.type || "image/jpeg";
        }
      }
      if (fb.audio) {
        const blob = dataUrlToBlobSync(fb.audio);
        if (blob) {
          const key = `share-${slug}-audio-${i}`;
          await idbPut(key, blob);
          f.audioKey = key;
        }
      }
      doc.frames.push(f);
    }
    // Replace the app's state with a single in-memory "share" doc.
    store = { active: bundle.name || "Shared", docs: { [bundle.name || "Shared"]: doc } };
    const totalDur = doc.frames.reduce((s, f) => s + (f.duration || 0), 0);
    document.body.innerHTML = `
      <div class="share-view">
        <div class="brand"><img src="elmo-fire.gif" alt="elmo" onerror="this.style.display='none'"></div>
        <h1>${escapeHtml(bundle.name || "Untitled")}</h1>
        <div class="meta">${doc.frames.length} FRAME${doc.frames.length === 1 ? "" : "S"} · ${totalDur.toFixed(1)}S</div>
        <button class="btn primary play-cta" id="sharePlayBtn">▶ Play</button>
        <div class="footer">Made with <a href="${location.origin}${location.pathname}" target="_blank">storyboard</a></div>
      </div>
      <div class="player" id="player" style="display:none">
        <div class="stage">
          <div class="img-stage" id="playerImgStage"><video id="playerVideo" muted loop playsinline></video></div>
          <div class="frameno" id="playerFrameNo"></div>
          <button class="btn close" id="closeBtn">Close ✕</button>
          <div class="description" id="playerDesc"></div>
          <div class="subtitle" id="playerSub"></div>
          <audio id="playerAudio"></audio>
          <audio id="playerMusic" loop></audio>
        </div>
        <div class="progress"><div class="bar" id="progressBar"></div></div>
        <div class="controls">
          <button class="btn" id="prevBtn">⏮ Prev</button>
          <button class="btn primary" id="playPauseBtn">⏸ Pause</button>
          <button class="btn" id="nextBtn">Next ⏭</button>
          <div class="time" id="timeReadout">0.0s / 0.0s</div>
        </div>
      </div>`;
    // The DOM has been replaced; the IIFE's player references are stale.
    // Reload them by reloading the page logic via a small bootstrap.
    bootShareModePlayer();
  }

  function bootShareModePlayer() {
    const playerEl = document.getElementById("player");
    const playerDesc = document.getElementById("playerDesc");
    const playerSub = document.getElementById("playerSub");
    const playerFrameNo = document.getElementById("playerFrameNo");
    const playerImgStage = document.getElementById("playerImgStage");
    const playerAudio = document.getElementById("playerAudio");
    const playerMusic = document.getElementById("playerMusic");
    const playerVideo = document.getElementById("playerVideo");
    const progressBar = document.getElementById("progressBar");
    const timeReadout = document.getElementById("timeReadout");
    const playPauseBtn = document.getElementById("playPauseBtn");
    let st = { playing: false, idx: 0, startedAt: 0, elapsedInFrame: 0, rafId: null };
    const frames = () => activeDoc().frames;
    const totalLength = () => frames().reduce((s,f)=>s+(f.duration||0),0);
    const elapsedBeforeIdx = (idx) => { let s=0; for (let i=0;i<idx;i++) s+=frames()[i].duration||0; return s; };
    async function showFrame(i) {
      const f = frames()[i]; if (!f) return;
      const type = f.imageKey ? mediaTypeFor(f, f.imageKey) : "";
      const isVid = isVideoType(type);
      if (f.imageKey) {
        const url = await blobUrl(f.imageKey);
        if (isVid) {
          playerImgStage.style.backgroundImage = "";
          playerImgStage.classList.add("has-video");
          if (url) { playerVideo.src = url; playerVideo.currentTime = 0; playerVideo.play().catch(()=>{}); }
        } else {
          playerImgStage.classList.remove("has-video");
          playerVideo.pause(); playerVideo.removeAttribute("src");
          if (url) playerImgStage.style.backgroundImage = `url("${url}")`;
        }
        playerDesc.classList.remove("fallback"); playerDesc.style.display = "none";
      } else {
        playerImgStage.style.backgroundImage = "";
        playerImgStage.classList.remove("has-video");
        playerVideo.pause(); playerVideo.removeAttribute("src");
        playerDesc.classList.add("fallback");
        playerDesc.textContent = f.description || "(no description)";
        playerDesc.style.display = "";
      }
      playerSub.textContent = f.subtitle || "";
      playerSub.style.display = f.subtitle ? "" : "none";
      playerFrameNo.textContent = `FRAME ${i+1} / ${frames().length}`;
      if (f.audioKey) {
        const url = await blobUrl(f.audioKey);
        playerAudio.src = url; playerAudio.currentTime = 0;
        if (st.playing) playerAudio.play().catch(()=>{});
      } else { playerAudio.removeAttribute("src"); }
    }
    async function start() {
      if (frames().length === 0) return;
      playerEl.style.display = "flex";
      st = { playing: true, idx: 0, startedAt: performance.now(), elapsedInFrame: 0, rafId: null };
      const doc = activeDoc();
      if (doc.musicKey) {
        const url = await blobUrl(doc.musicKey);
        playerMusic.src = url; playerMusic.volume = 0.45;
        playerMusic.currentTime = 0; playerMusic.play().catch(()=>{});
      } else { playerMusic.removeAttribute("src"); }
      showFrame(0); playPauseBtn.textContent = "⏸ Pause"; tick();
    }
    function stop() {
      st.playing = false; cancelAnimationFrame(st.rafId);
      playerAudio.pause(); playerMusic.pause(); playerVideo.pause();
      playerEl.style.display = "none";
    }
    function pause() {
      if (!st.playing) return;
      st.elapsedInFrame += (performance.now() - st.startedAt) / 1000;
      st.playing = false; cancelAnimationFrame(st.rafId);
      playerAudio.pause(); playerMusic.pause(); playerVideo.pause();
      playPauseBtn.textContent = "▶ Play";
    }
    function resume() {
      if (st.playing) return;
      st.playing = true; st.startedAt = performance.now();
      if (playerAudio.src) playerAudio.play().catch(()=>{});
      if (playerMusic.src) playerMusic.play().catch(()=>{});
      if (playerVideo.src) playerVideo.play().catch(()=>{});
      playPauseBtn.textContent = "⏸ Pause"; tick();
    }
    function gotoFrame(i) {
      if (i < 0 || i >= frames().length) return;
      st.idx = i; st.elapsedInFrame = 0; st.startedAt = performance.now();
      showFrame(i);
    }
    function tick() {
      if (!st.playing) return;
      const f = frames()[st.idx];
      const hasAudio = !!(f.audioKey && playerAudio.src && isFinite(playerAudio.duration) && playerAudio.duration > 0);
      let inFrame, frameDur;
      if (hasAudio) { inFrame = playerAudio.currentTime; frameDur = playerAudio.duration; }
      else { inFrame = st.elapsedInFrame + (performance.now() - st.startedAt) / 1000; frameDur = f.duration; }
      const total = totalLength();
      const overall = elapsedBeforeIdx(st.idx) + Math.min(inFrame, frameDur);
      progressBar.style.width = `${(overall/total)*100}%`;
      timeReadout.textContent = `${overall.toFixed(1)}s / ${total.toFixed(1)}s`;
      if (inFrame >= frameDur) {
        if (st.idx >= frames().length - 1) {
          progressBar.style.width = "100%"; st.playing = false;
          playerAudio.pause(); playerMusic.pause(); playerVideo.pause();
          playPauseBtn.textContent = "↻ Replay"; return;
        }
        st.idx += 1; st.elapsedInFrame = 0; st.startedAt = performance.now();
        showFrame(st.idx);
      }
      st.rafId = requestAnimationFrame(tick);
    }
    document.getElementById("sharePlayBtn").addEventListener("click", start);
    document.getElementById("closeBtn").addEventListener("click", stop);
    document.getElementById("prevBtn").addEventListener("click", () => gotoFrame(st.idx - 1));
    document.getElementById("nextBtn").addEventListener("click", () => gotoFrame(st.idx + 1));
    playPauseBtn.addEventListener("click", () => {
      if (playPauseBtn.textContent.startsWith("↻")) { start(); return; }
      st.playing ? pause() : resume();
    });
    document.addEventListener("keydown", (e) => {
      if (playerEl.style.display === "none") return;
      if (e.key === "Escape") stop();
      if (e.key === " ") { e.preventDefault(); playPauseBtn.click(); }
      if (e.key === "ArrowRight") gotoFrame(st.idx + 1);
      if (e.key === "ArrowLeft") gotoFrame(st.idx - 1);
    });
  }

  // --- MP4 export ---
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }
  function drawCover(ctx, img, w, h) {
    const iAR = img.width / img.height;
    const cAR = w / h;
    let dw, dh, dx, dy;
    if (iAR > cAR) { dh = h; dw = h * iAR; dx = (w - dw) / 2; dy = 0; }
    else            { dw = w; dh = w / iAR; dx = 0; dy = (h - dh) / 2; }
    ctx.drawImage(img, dx, dy, dw, dh);
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight, anchor = "middle") {
    const words = text.split(/\s+/);
    const lines = []; let line = "";
    for (const word of words) {
      const test = line + (line ? " " : "") + word;
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
      else line = test;
    }
    if (line) lines.push(line);
    let startY;
    if (anchor === "bottom") startY = y - (lines.length - 1) * lineHeight;
    else if (anchor === "top") startY = y;
    else startY = y - (lines.length - 1) * lineHeight / 2;
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], x, startY + i * lineHeight);
    }
    return lines.length;
  }

  function renderExportFrame(ctx, W, H, f) {
    if (f.video && f.video.readyState >= 2) {
      drawCover(ctx, f.video, W, H);
    } else if (f.img) {
      drawCover(ctx, f.img, W, H);
    } else {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      if (f.description) {
        ctx.font = '500 56px -apple-system, "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = "center"; ctx.fillStyle = "#ececec";
        wrapText(ctx, f.description, W/2, H/2, W - 240, 72);
      }
    }
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "rgba(0,0,0,0.45)");
    grad.addColorStop(0.32, "rgba(0,0,0,0)");
    grad.addColorStop(0.68, "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0,0.75)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.font = '500 26px "Roboto Mono", ui-monospace, monospace';
    ctx.textAlign = "left"; ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillText(`FRAME ${f.idx} / ${f.total}`, 56, 76);
    if (f.subtitle) {
      ctx.font = '600 56px -apple-system, "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = "center"; ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0,0,0,0.95)";
      ctx.shadowBlur = 18; ctx.shadowOffsetY = 3;
      wrapText(ctx, f.subtitle, W/2, H - 140, W - 240, 72, "bottom");
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    }
  }

  function showExportStatus(initial) {
    let el = document.getElementById("exportStatus");
    if (!el) {
      el = document.createElement("div");
      el.id = "exportStatus"; el.className = "export-status";
      el.innerHTML = `<span class="label">${initial}</span><div class="bar"><div></div></div><span class="pct">0%</span>`;
      document.body.appendChild(el);
    } else {
      el.querySelector(".label").textContent = initial;
    }
    return el;
  }
  function updateExportStatus(el, label, pct) {
    el.querySelector(".label").textContent = label;
    el.querySelector(".bar > div").style.width = `${pct}%`;
    el.querySelector(".pct").textContent = `${Math.round(pct)}%`;
  }
  function hideExportStatus() {
    const el = document.getElementById("exportStatus");
    if (el) el.remove();
  }

  async function exportStoryboard() {
    const doc = activeDoc();
    if (!doc.frames.length) { alert("No frames to export."); return; }

    const W = 2560, H = 1440, FPS = 30;
    const btn = document.getElementById("downloadBtn");
    btn.disabled = true;
    const status = showExportStatus("Preparing assets…");

    try {
      const total = doc.frames.length;
      // Pre-load all assets
      const frameAssets = [];
      const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < doc.frames.length; i++) {
        updateExportStatus(status, `Loading frame ${i+1} / ${total}…`, (i / total) * 10);
        const f = doc.frames[i];
        let img = null, video = null;
        if (f.imageKey) {
          const u = await blobUrl(f.imageKey);
          if (u) {
            const type = mediaTypeFor(f, f.imageKey);
            if (isVideoType(type)) {
              try {
                video = document.createElement("video");
                video.src = u; video.muted = true; video.loop = true; video.playsInline = true;
                video.crossOrigin = "anonymous";
                await new Promise((res, rej) => {
                  video.onloadeddata = res; video.onerror = rej;
                  setTimeout(rej, 15000);
                });
              } catch { video = null; }
            } else {
              try { img = await loadImage(u); } catch {}
            }
          }
        }
        let voiceBuf = null;
        if (f.audioKey) {
          const blob = await idbGet(f.audioKey);
          if (blob) {
            try {
              const ab = await blob.arrayBuffer();
              voiceBuf = await decodeCtx.decodeAudioData(ab.slice(0));
            } catch (e) { console.warn("voice decode failed", e); }
          }
        }
        const duration = voiceBuf ? voiceBuf.duration : (f.duration || 1);
        frameAssets.push({
          img, video, voiceBuf, subtitle: f.subtitle, description: f.description,
          duration, idx: i+1, total
        });
      }

      let musicBuf = null;
      if (doc.musicKey) {
        updateExportStatus(status, "Loading soundtrack…", 12);
        const blob = await idbGet(doc.musicKey);
        if (blob) {
          try {
            const ab = await blob.arrayBuffer();
            musicBuf = await decodeCtx.decodeAudioData(ab.slice(0));
          } catch (e) { console.warn("music decode failed", e); }
        }
      }
      await decodeCtx.close();

      const frameStarts = []; let t = 0;
      for (const a of frameAssets) { frameStarts.push(t); t += a.duration; }
      const totalDuration = t;
      if (totalDuration <= 0) throw new Error("Storyboard has zero duration.");

      // Canvas
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d", { alpha: false });
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

      // Audio mixing
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = audioCtx.createMediaStreamDestination();

      // Streams
      const canvasStream = canvas.captureStream(FPS);
      const stream = new MediaStream([
        canvasStream.getVideoTracks()[0],
        ...dest.stream.getAudioTracks()
      ]);

      const candidates = [
        'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      let mimeType = "";
      for (const c of candidates) { if (MediaRecorder.isTypeSupported(c)) { mimeType = c; break; } }
      if (!mimeType) throw new Error("Browser doesn't support MediaRecorder for video export.");

      const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 10_000_000,
        audioBitsPerSecond: 192_000
      });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      const result = await new Promise((resolve, reject) => {
        recorder.onerror = (e) => reject(new Error("MediaRecorder error: " + (e.error && e.error.message || "unknown")));
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mimeType });
          const ext = mimeType.startsWith("video/mp4") ? "mp4" : "webm";
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${store.active.replace(/[^\w-]+/g, "_")}.${ext}`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          resolve({ ext });
        };

        recorder.start(1000);

        const t0 = audioCtx.currentTime + 0.15;

        if (musicBuf) {
          const src = audioCtx.createBufferSource();
          src.buffer = musicBuf; src.loop = true;
          const gain = audioCtx.createGain();
          gain.gain.value = 0.45;
          src.connect(gain).connect(dest);
          src.start(t0);
          src.stop(t0 + totalDuration);
        }
        for (let i = 0; i < frameAssets.length; i++) {
          const a = frameAssets[i];
          if (a.voiceBuf) {
            const src = audioCtx.createBufferSource();
            src.buffer = a.voiceBuf;
            src.connect(dest);
            src.start(t0 + frameStarts[i]);
          }
        }

        renderExportFrame(ctx, W, H, frameAssets[0]);
        if (frameAssets[0].video) { try { frameAssets[0].video.currentTime = 0; frameAssets[0].video.play().catch(()=>{}); } catch {} }
        let lastVideoIdx = frameAssets[0].video ? 0 : -1;

        const draw = () => {
          const elapsed = audioCtx.currentTime - t0;
          if (elapsed >= totalDuration) {
            updateExportStatus(status, "Finalizing…", 99);
            frameAssets.forEach(a => { if (a.video) try { a.video.pause(); } catch {} });
            setTimeout(() => { try { recorder.stop(); } catch (e) { reject(e); } }, 400);
            return;
          }
          if (elapsed < 0) { requestAnimationFrame(draw); return; }
          let curIdx = 0;
          for (let i = 0; i < frameStarts.length; i++) if (elapsed >= frameStarts[i]) curIdx = i;
          if (curIdx !== lastVideoIdx) {
            if (lastVideoIdx >= 0 && frameAssets[lastVideoIdx] && frameAssets[lastVideoIdx].video) {
              try { frameAssets[lastVideoIdx].video.pause(); } catch {}
            }
            if (frameAssets[curIdx] && frameAssets[curIdx].video) {
              try { frameAssets[curIdx].video.currentTime = 0; frameAssets[curIdx].video.play().catch(()=>{}); } catch {}
              lastVideoIdx = curIdx;
            } else {
              lastVideoIdx = -1;
            }
          }
          renderExportFrame(ctx, W, H, frameAssets[curIdx]);
          const pct = Math.min(98, (elapsed / totalDuration) * 100);
          updateExportStatus(status, `Rendering · ${elapsed.toFixed(1)}s / ${totalDuration.toFixed(1)}s · frame ${curIdx+1}/${frameAssets.length}`, pct);
          requestAnimationFrame(draw);
        };
        requestAnimationFrame(draw);
      });

      hideExportStatus();
      if (result.ext === "webm") {
        alert("Saved as .webm — your browser doesn't support direct MP4 from MediaRecorder. WebM plays in most modern apps; you can convert with HandBrake or ffmpeg if needed.");
      }
      await audioCtx.close();
    } catch (e) {
      console.error(e);
      alert("Export failed: " + e.message);
      hideExportStatus();
    } finally {
      btn.disabled = false;
    }
  }
  document.getElementById("downloadBtn").addEventListener("click", exportStoryboard);

  function renderAll() { renderDocPicker(); renderMusic(); renderEditor(); }

  // --- init ---
  loadSettings();
  const shareSlug = new URLSearchParams(location.search).get("share");
  if (shareSlug) {
    enterShareMode(shareSlug);
    return; // skip editor setup
  }
  if (!load() || Object.keys(store.docs).length === 0) {
    store.docs["Untitled"] = blankDoc();
    store.active = "Untitled";
    save();
  }
  renderAll();
  migrateInlineToIdb().then(() => renderAll()).catch(e => console.warn("migration failed", e));

  // First-run: prompt for keys if none configured
  if (!settings.bflKey && !settings.bflProxyUrl && !settings.elevenKey) {
    setTimeout(showSettings, 200);
  }

  window.addEventListener("resize", () => {
    const doc = activeDoc();
    doc.frames.forEach((f, i) => {
      const c = document.querySelector(`[data-wave="${i}"] canvas`);
      if (c) drawWaveform(c, f.wave);
    });
  });
})();
</script>
</body>
