<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --panel-2: #1e1e1e;
    --line: #2a2a2a;
    --line-2: #353535;
    --text: #ececec;
    --muted: #8a8a8a;
    --accent: #e9b949;
    --accent-2: #d9d9d9;
    --danger: #ff5d5d;
    --good: #6ed18a;
    --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button { font-family: inherit; }
  input, textarea, select {
    font-family: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent-2); }
  textarea { resize: vertical; }

  .app {
    min-height: 100%;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
  }
  main {
    min-width: 0;
    padding: 14px 16px 30px;
  }

  /* Floating right panel */
  .side-panel {
    position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 18px 18px 24px;
    display: flex; flex-direction: column;
    gap: 18px;
  }
  .side-panel .section {
    display: flex; flex-direction: column; gap: 10px;
  }
  .side-panel .section-divider {
    height: 1px; background: var(--line); margin: 4px -4px;
  }
  .brand { display: flex; align-items: center; height: 22px; }
  .brand img { max-height: 22px; display: block; }

  .doc-picker { display: flex; align-items: center; gap: 6px; }
  .doc-picker select {
    flex: 1; min-width: 0; padding: 7px 28px 7px 10px; font-size: 13px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px; background-repeat: no-repeat;
    -webkit-appearance: none; appearance: none;
  }

  .config {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 12px;
    flex-wrap: wrap;
  }
  .config input[type=number] { width: 60px; padding: 6px 8px; font-size: 13px; }

  .panel-play, .panel-download {
    width: 100%; justify-content: center;
    padding: 12px; font-size: 14px;
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side-panel {
      position: static; height: auto;
      border-left: none; border-bottom: 1px solid var(--line);
    }
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer; font-size: 13px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; }
  .btn.icon { padding: 6px 10px; font-size: 13px; }
  .btn.tiny { padding: 4px 8px; font-size: 11px; font-family: var(--mono); letter-spacing: .5px; }
  .btn.danger { color: var(--danger); border-color: transparent; background: transparent; }
  .btn.danger:hover { background: rgba(255,93,93,.08); }

  /* Music section (inside side panel) */
  .music { display: flex; flex-direction: column; gap: 8px; }
  .music .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .music input { font-size: 13px; }
  .music .wave-mini {
    height: 56px; background: #050505; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px; position: relative;
    overflow: hidden;
  }
  .music .wave-mini.has-audio { cursor: pointer; }
  .music .wave-mini canvas { width: 100%; height: 100%; position: relative; z-index: 1; }
  .music .wave-mini .placeholder {
    color: #444; font-family: var(--mono); font-size: 10px;
    display: flex; align-items: center; justify-content: center; height: 100%;
    text-align: center; padding: 0 8px;
  }
  .music .wave-mini .progress-overlay {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: rgba(233,185,73,.18);
    border-right: 2px solid var(--accent);
    width: 0%; pointer-events: none; z-index: 2;
    transition: width .08s linear;
  }
  .music-time {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
  }

  .label-mono {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--muted); font-weight: 500;
    display: block; margin-bottom: 6px;
  }


  /* Editor */
  .editor { width: 100%; }
  .frames {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  @media (max-width: 1180px) {
    .frames { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .frames { grid-template-columns: 1fr; }
  }

  .frame {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px 12px;
    display: flex; flex-direction: column;
    gap: 8px;
    position: relative;
    transition: opacity .15s, transform .15s;
    min-width: 0;
  }
  .frame.dragging { opacity: .35; }
  .frame.drop-before::before,
  .frame.drop-after::after {
    content: ""; position: absolute; top: 6px; bottom: 6px;
    width: 3px; background: var(--accent); border-radius: 2px;
    pointer-events: none;
  }
  .frame.drop-before::before { left: -8px; }
  .frame.drop-after::after { right: -8px; }
  .frame-head {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-family: var(--mono); font-size: 11px;
  }
  .frame-head .grip {
    cursor: grab; user-select: none;
    color: #555; font-size: 12px; line-height: 1;
    padding: 2px; margin-left: -2px;
    letter-spacing: -2px;
  }
  .frame-head .grip:hover { color: var(--accent); }
  .frame-head .grip:active { cursor: grabbing; }
  .frame-head .num { color: var(--accent); font-weight: 500; }
  .frame-head .spacer { flex: 1; }
  .frame-head .dur { display: flex; align-items: center; gap: 4px; font-size: 10px; }
  .frame-head .dur input {
    width: 48px; padding: 3px 5px; font-size: 11px; text-align: center;
    font-family: var(--mono);
  }
  .frame-head .remove {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 5px; font-size: 14px; line-height: 1; border-radius: 6px;
  }
  .frame-head .remove:hover { color: var(--danger); background: rgba(255,93,93,.08); }

  .frame-body {
    display: flex; flex-direction: column; gap: 8px;
  }

  .col { display: flex; flex-direction: column; }
  .col-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .col-head label {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: 1.4px; color: var(--muted); font-weight: 500;
  }
  .col-head .btn.tiny { padding: 3px 6px; font-size: 10px; }

  /* Image preview */
  .img-preview {
    background: #050505; border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
    aspect-ratio: 16 / 9; margin-bottom: 0;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .img-preview img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .img-preview .placeholder {
    color: #444; font-family: var(--mono); font-size: 10px;
    text-align: center; padding: 0 8px; line-height: 1.5;
  }
  .img-preview.loading::after {
    content: "rendering…"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-family: var(--mono); font-size: 11px;
    background: rgba(5,5,5,.85); letter-spacing: 2px;
  }
  .img-preview .corner {
    position: absolute; top: 6px; right: 6px;
    display: none; gap: 4px;
  }
  .img-preview:hover .corner { display: flex; }
  .img-preview .corner button {
    background: rgba(0,0,0,.7); border: 1px solid var(--line);
    color: var(--text); padding: 3px 6px; border-radius: 4px;
    font-family: var(--mono); font-size: 10px; cursor: pointer;
  }
  .img-preview .corner button:hover { border-color: var(--accent); }

  /* Waveform */
  .wave-preview {
    background: #050505; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px;
    margin-bottom: 0;
    height: 56px;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .wave-preview canvas { width: 100%; height: 100%; display: block; }
  .wave-preview .placeholder {
    color: #444; font-family: var(--mono); font-size: 10px;
    text-align: center; padding: 0 8px;
  }
  .wave-preview.loading::after {
    content: "rendering…"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-family: var(--mono); font-size: 11px;
    background: rgba(5,5,5,.85); letter-spacing: 2px;
  }
  .wave-controls {
    display: flex; gap: 4px; align-items: center; margin: 0;
  }
  .wave-controls .btn.tiny { padding: 3px 6px; font-size: 10px; }

  .col textarea {
    min-height: 92px; flex: none;
    padding: 8px 10px; font-size: 13px;
    line-height: 1.45;
  }
  #musicPrompt {
    min-height: 168px;
    font-size: 13px; line-height: 1.45;
  }

  .add-row { display: flex; justify-content: center; padding: 18px 0 8px; }

  .summary {
    color: var(--muted); font-size: 12px; padding: 8px 4px 0;
    display: flex; justify-content: space-between;
    font-family: var(--mono); letter-spacing: .5px;
  }

  /* Player */
  .player {
    position: fixed; inset: 0;
    background: #000;
    display: flex; flex-direction: column; z-index: 100;
  }
  .player .stage {
    flex: 1; position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  .player .img-stage {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-color: #000;
  }
  .player .img-stage::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 35%, transparent 65%, rgba(0,0,0,.4) 100%);
  }
  .player .frameno {
    position: absolute; top: 24px; left: 28px; z-index: 2;
    color: rgba(255,255,255,.7); font-size: 12px;
    font-family: var(--mono); letter-spacing: 2px;
  }
  .player .close { position: absolute; top: 18px; right: 18px; z-index: 2; }
  .player .description {
    position: relative; z-index: 1;
    font-size: clamp(20px, 2.8vw, 32px);
    line-height: 1.25; max-width: 1100px; color: #fff;
    font-weight: 500; padding: 0 4vw;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }
  .player .description.fallback {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  .player .subtitle {
    position: absolute; bottom: 8vh; left: 0; right: 0; z-index: 2;
    font-size: clamp(18px, 2.2vw, 28px);
    color: #fff; max-width: 1000px; margin: 0 auto;
    line-height: 1.4; padding: 0 4vw;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
    font-weight: 500;
  }

  .player .progress { height: 4px; background: rgba(255,255,255,.08); position: relative; z-index: 5; }
  .player .progress .bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); width: 0%;
    transition: width .1s linear;
  }
  .player .controls {
    display: flex; justify-content: center; align-items: center; gap: 14px;
    padding: 16px;
    background: #0a0a0a;
    border-top: 1px solid #1a1a1a; z-index: 5;
  }
  .player .controls .time {
    color: var(--muted); font-variant-numeric: tabular-nums; min-width: 110px; text-align: center;
    font-family: var(--mono);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 22px; min-width: 380px; max-width: 560px;
    width: 92%; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .modal label {
    display: block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px; margin-top: 12px;
  }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal a { color: var(--accent-2); text-decoration: none; }
  .modal a:hover { text-decoration: underline; }

  /* Export progress */
  .export-status {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: 10px; padding: 14px 22px;
    font-family: var(--mono); font-size: 13px;
    z-index: 300; color: var(--text);
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 14px;
    min-width: 360px;
  }
  .export-status .label { white-space: nowrap; }
  .export-status .bar {
    flex: 1; height: 4px; background: rgba(255,255,255,.08);
    border-radius: 2px; overflow: hidden;
  }
  .export-status .bar > div {
    height: 100%; background: var(--accent); width: 0%;
    transition: width .15s linear;
  }
  .export-status .pct { font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
</style>
</head>
<body>
<div class="app">
  <main>
    <div class="editor">
      <div id="frames" class="frames"></div>
      <div class="add-row">
        <button class="btn" id="addFrame">+ Add frame</button>
      </div>
      <div class="summary">
        <div id="summaryLeft">0 frames</div>
        <div id="summaryRight">0s total</div>
      </div>
    </div>
  </main>

  <aside class="side-panel">
    <div class="section">
      <div class="brand"><img src="elmo-fire.gif" alt="elmo" onerror="this.style.display='none'"></div>
    </div>

    <div class="section">
      <span class="label-mono">Storyboard</span>
      <div class="doc-picker">
        <select id="docSelect" title="Storyboard"></select>
        <button class="btn icon" id="newDoc" title="New">+</button>
        <button class="btn icon" id="renameDoc" title="Rename">✎</button>
        <button class="btn icon" id="deleteDoc" title="Delete">🗑</button>
      </div>
      <div class="config">
        <span>Total</span>
        <input id="totalSec" type="number" min="5" step="5" value="60" />
        <span>s · per frame</span>
        <input id="frameSec" type="number" min="1" step="1" value="5" />
        <span>s</span>
        <button class="btn ghost" id="applyTiming">Reset</button>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="section music">
      <span class="label-mono">Soundtrack</span>
      <div class="row">
        <textarea id="musicPrompt" rows="8" placeholder="Cinematic ambient, slow strings, melancholic… (describe genre, mood, instruments, tempo)"></textarea>
      </div>
      <div class="row">
        <button class="btn primary" id="genMusic" style="flex:1">⚡ Generate</button>
      </div>
      <div class="wave-mini" id="musicWave">
        <div class="placeholder">No track yet. Write a prompt, then Generate.</div>
      </div>
      <div class="row" id="musicControls" style="display:none">
        <button class="btn tiny" id="musicPlayPause" title="Play/Pause">▶ Play</button>
        <button class="btn tiny" id="musicStop" title="Stop">⏹</button>
        <button class="btn tiny" id="musicRestart" title="Restart">↻</button>
        <span class="music-time" id="musicTime">0:00 / 0:00</span>
      </div>
      <div class="row" id="musicSecondary" style="display:none">
        <button class="btn tiny" id="clearMusic">Clear track</button>
      </div>
      <audio id="musicAudio" preload="metadata"></audio>
    </div>

    <div class="section-divider"></div>

    <div class="section">
      <button class="btn" id="settingsBtn" title="API keys & voice">⚙ API keys</button>
    </div>

    <div class="section" style="margin-top:auto">
      <button class="btn primary panel-play" id="playBtn">▶ Play</button>
      <button class="btn panel-download" id="downloadBtn">⬇ Download MP4 (2K)</button>
    </div>
  </aside>
</div>

<div class="player" id="player" style="display:none">
  <div class="stage">
    <div class="img-stage" id="playerImgStage"></div>
    <div class="frameno" id="playerFrameNo"></div>
    <button class="btn close" id="closeBtn">Close ✕</button>
    <div class="description" id="playerDesc"></div>
    <div class="subtitle" id="playerSub"></div>
    <audio id="playerAudio"></audio>
    <audio id="playerMusic" loop></audio>
  </div>
  <div class="progress"><div class="bar" id="progressBar"></div></div>
  <div class="controls">
    <button class="btn" id="prevBtn">⏮ Prev</button>
    <button class="btn primary" id="playPauseBtn">⏸ Pause</button>
    <button class="btn" id="nextBtn">Next ⏭</button>
    <div class="time" id="timeReadout">0.0s / 0.0s</div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<audio id="prevAudio"></audio>

<script>
(() => {
  const STORAGE_KEY = "storyboard.v4";
  const SETTINGS_KEY = "storyboard.settings.v2";

  const ELEVEN_VOICES = [
    { id: "pNInz6obpgDQGcFmaJgB", name: "Adam — deep, smooth" },
    { id: "ErXwobaYiN019PkySvjV", name: "Antoni — warm, well-rounded" },
    { id: "TxGEqnHWrfWFTfGW9XjX", name: "Josh — young, deep" },
    { id: "VR6AewLTigWG4xSOukaG", name: "Arnold — crisp" },
    { id: "yoZ06aMxZJJ28mfd3POQ", name: "Sam — raspy" },
    { id: "onwK4e9ZLuTAKqWW03F9", name: "Daniel — narration" }
  ];

  let store = { active: "Untitled", docs: {} };
  let settings = {
    bflKey: "",
    bflProxyUrl: "",
    elevenKey: "",
    voiceId: "pNInz6obpgDQGcFmaJgB",
    bflModel: "flux-pro-1.1"
  };

  function blankDoc() {
    const totalSec = 60, frameSec = 5;
    const count = Math.round(totalSec / frameSec);
    return {
      totalSec, frameSec,
      musicKey: "", musicPrompt: "",
      frames: Array.from({length: count}, () => makeFrame(frameSec))
    };
  }
  function makeFrame(duration) {
    return { description:"", subtitle:"", duration, imageKey:"", audioKey:"", wave:[] };
  }

  // --- IndexedDB for binary blobs ---
  let _dbPromise = null;
  function db() {
    if (_dbPromise) return _dbPromise;
    _dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open("storyboard-assets", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("blobs");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return _dbPromise;
  }
  async function idbPut(key, blob) {
    const d = await db();
    return new Promise((resolve, reject) => {
      const tx = d.transaction("blobs", "readwrite");
      tx.objectStore("blobs").put(blob, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key) {
    if (!key) return null;
    const d = await db();
    return new Promise((resolve, reject) => {
      const tx = d.transaction("blobs", "readonly");
      const req = tx.objectStore("blobs").get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbDel(key) {
    if (!key) return;
    const d = await db();
    return new Promise((resolve, reject) => {
      const tx = d.transaction("blobs", "readwrite");
      tx.objectStore("blobs").delete(key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  const _blobUrls = new Map();
  async function blobUrl(key) {
    if (!key) return "";
    if (_blobUrls.has(key)) return _blobUrls.get(key);
    const blob = await idbGet(key);
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    _blobUrls.set(key, url);
    return url;
  }
  function dataUrlToBlob(dataUrl) { return fetch(dataUrl).then(r => r.blob()); }
  function newKey(prefix) { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`; }
  function uniqueName(base) {
    if (!store.docs[base]) return base;
    let i = 2;
    while (store.docs[`${base} ${i}`]) i++;
    return `${base} ${i}`;
  }
  function activeDoc() { return store.docs[store.active]; }

  // --- persistence ---
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    catch (e) {
      console.warn("storage full", e);
      alert("Storage full — try clearing generated assets or deleting an old storyboard.");
    }
  }
  function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
  function loadSettings() {
    try { const raw = localStorage.getItem(SETTINGS_KEY); if (raw) Object.assign(settings, JSON.parse(raw)); } catch {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && data.docs && data.active && data.docs[data.active]) {
          store = data;
          for (const k of Object.keys(store.docs)) {
            const d = store.docs[k];
            if (d.musicKey == null) d.musicKey = "";
            if (d.musicPrompt == null) d.musicPrompt = "";
            for (const f of d.frames) {
              if (f.imageKey == null) f.imageKey = "";
              if (f.audioKey == null) f.audioKey = "";
              if (f.wave == null) f.wave = [];
            }
          }
          return true;
        }
      }
    } catch {}
    return false;
  }

  async function migrateInlineToIdb() {
    let changed = false;
    for (const docName of Object.keys(store.docs)) {
      const d = store.docs[docName];
      if (d.music && typeof d.music === "string" && d.music.startsWith("data:")) {
        try {
          const blob = await dataUrlToBlob(d.music);
          const key = newKey("music");
          await idbPut(key, blob);
          d.musicKey = key;
        } catch (e) { console.warn("music migration failed", e); }
        delete d.music; changed = true;
      }
      for (const f of d.frames) {
        if (f.image && typeof f.image === "string" && f.image.startsWith("data:")) {
          try {
            const blob = await dataUrlToBlob(f.image);
            const key = newKey("img");
            await idbPut(key, blob);
            f.imageKey = key;
          } catch (e) { console.warn("image migration failed", e); }
          delete f.image; changed = true;
        }
        if (f.audio && typeof f.audio === "string" && f.audio.startsWith("data:")) {
          try {
            const blob = await dataUrlToBlob(f.audio);
            const key = newKey("audio");
            await idbPut(key, blob);
            f.audioKey = key;
          } catch (e) { console.warn("audio migration failed", e); }
          delete f.audio; changed = true;
        }
      }
    }
    if (changed) save();
  }

  // --- helpers ---
  function escapeHtml(s) {
    return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function formatTime(s) {
    const rounded = Math.round(s);
    const m = Math.floor(rounded/60); const r = rounded%60;
    return `${m}:${String(r).padStart(2,"0")}`;
  }
  function formatSecsShort(s) {
    if (s % 1 === 0) return String(s);
    return s.toFixed(2).replace(/\.?0+$/, "");
  }
  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  async function urlToCompressedBlob(url, maxWidth = 1280, quality = 0.85) {
    const res = await fetch(url);
    const blob = await res.blob();
    const img = new Image();
    const objUrl = URL.createObjectURL(blob);
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = objUrl; });
    const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
    const w = Math.round(img.width * ratio);
    const h = Math.round(img.height * ratio);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(objUrl);
    return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
  }
  async function computeWaveform(blob, bins = 96) {
    const buf = await blob.arrayBuffer();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ac = new Ctx();
    const decoded = await ac.decodeAudioData(buf.slice(0));
    const ch = decoded.getChannelData(0);
    const duration = decoded.duration;
    const samplesPerBin = Math.floor(ch.length / bins);
    const peaks = [];
    let globalMax = 0;
    for (let i = 0; i < bins; i++) {
      let max = 0;
      const start = i * samplesPerBin;
      const end = start + samplesPerBin;
      for (let j = start; j < end; j++) {
        const v = Math.abs(ch[j]);
        if (v > max) max = v;
      }
      peaks.push(max);
      if (max > globalMax) globalMax = max;
    }
    if (globalMax > 0) for (let i = 0; i < peaks.length; i++) peaks[i] /= globalMax;
    ac.close();
    return { peaks, duration };
  }
  function drawWaveform(canvas, peaks) {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0) { requestAnimationFrame(() => drawWaveform(canvas, peaks)); return; }
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, rect.width, rect.height);
    if (!peaks || peaks.length === 0) return;
    const mid = rect.height / 2;
    const barWidth = rect.width / peaks.length;
    const barPad = Math.max(0.5, barWidth * 0.25);
    ctx.fillStyle = "#e9b949";
    peaks.forEach((p, i) => {
      const h = Math.max(1, p * (rect.height - 4));
      ctx.fillRect(i * barWidth + barPad/2, mid - h/2, Math.max(1, barWidth - barPad), h);
    });
  }

  // --- render ---
  const framesEl = document.getElementById("frames");
  const summaryLeft = document.getElementById("summaryLeft");
  const summaryRight = document.getElementById("summaryRight");
  const docSelect = document.getElementById("docSelect");

  function renderDocPicker() {
    docSelect.innerHTML = "";
    Object.keys(store.docs).sort().forEach(name => {
      const opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      if (name === store.active) opt.selected = true;
      docSelect.appendChild(opt);
    });
  }

  function fmtSec(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60), r = Math.floor(s%60);
    return `${m}:${String(r).padStart(2,"0")}`;
  }
  function updateMusicTime() {
    const a = document.getElementById("musicAudio");
    document.getElementById("musicTime").textContent = `${fmtSec(a.currentTime || 0)} / ${fmtSec(a.duration || 0)}`;
    const overlay = document.querySelector("#musicWave .progress-overlay");
    if (overlay && a.duration) overlay.style.width = `${(a.currentTime / a.duration) * 100}%`;
  }
  function renderMusic() {
    const doc = activeDoc();
    document.getElementById("musicPrompt").value = doc.musicPrompt || "";
    const mc = document.getElementById("musicControls");
    const ms = document.getElementById("musicSecondary");
    const mw = document.getElementById("musicWave");
    const audio = document.getElementById("musicAudio");
    mw.innerHTML = "";
    if (doc.musicKey) {
      const c = document.createElement("canvas");
      mw.appendChild(c);
      const overlay = document.createElement("div");
      overlay.className = "progress-overlay";
      mw.appendChild(overlay);
      mw.classList.add("has-audio");
      mc.style.display = "flex";
      ms.style.display = "flex";
      idbGet(doc.musicKey).then(async b => {
        if (!b) return;
        const url = await blobUrl(doc.musicKey);
        audio.src = url;
        const { peaks } = await computeWaveform(b, 200);
        drawWaveform(c, peaks);
        audio.addEventListener("loadedmetadata", updateMusicTime, { once: true });
      }).catch(()=>{});
      document.getElementById("musicPlayPause").textContent = audio.paused ? "▶ Play" : "⏸ Pause";
    } else {
      mw.classList.remove("has-audio");
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "No track yet. Write a prompt, then Generate.";
      mw.appendChild(ph);
      mc.style.display = "none";
      ms.style.display = "none";
      audio.removeAttribute("src");
    }
  }

  function frameImageHtml(f) {
    if (!f.imageKey) {
      return `<div class="placeholder">Write description<br>→ Generate</div>`;
    }
    return `<img alt="" data-key="${f.imageKey}" /><div class="corner"><button data-action="regen-image">↻</button><button data-action="clear-image">×</button></div>`;
  }
  function hydrateImages(root) {
    root.querySelectorAll('img[data-key]').forEach(img => {
      const key = img.dataset.key;
      blobUrl(key).then(url => { if (url) img.src = url; });
    });
  }

  function renderEditor() {
    const doc = activeDoc();
    framesEl.innerHTML = "";
    let t = 0;
    doc.frames.forEach((f, i) => {
      const start = t; t += f.duration;
      const row = document.createElement("div");
      row.className = "frame";
      row.dataset.frameIdx = i;
      row.innerHTML = `
        <div class="frame-head">
          <span class="grip" draggable="true" data-frame-idx="${i}" title="Drag to reorder">⋮⋮</span>
          <span class="num">#${String(i+1).padStart(2,"0")}</span>
          <span>${formatTime(start)} – ${formatTime(start + f.duration)}</span>
          <span class="spacer"></span>
          <span class="dur">
            <input type="number" min="0.1" step="0.1" data-i="${i}" data-k="duration" value="${formatSecsShort(f.duration)}" title="${f.audioKey ? 'Auto-set from voiceover length. Clear voiceover to edit.' : 'Seconds'}" ${f.audioKey ? "readonly" : ""} />
            <span>sec${f.audioKey ? " · auto" : ""}</span>
          </span>
          <button class="remove" data-action="remove" data-i="${i}" title="Remove frame">×</button>
        </div>
        <div class="frame-body">
          <div class="col">
            <div class="col-head">
              <label>What you see</label>
              <button class="btn tiny" data-action="gen-image" data-i="${i}">⚡ Generate</button>
            </div>
            <textarea rows="4" data-i="${i}" data-k="description" placeholder="A wide shot of an empty diner at dusk, neon humming…"></textarea>
            <div class="img-preview" data-img="${i}">${frameImageHtml(f)}</div>
          </div>
          <div class="col">
            <div class="col-head">
              <label>What you hear</label>
              <button class="btn tiny" data-action="gen-voice" data-i="${i}">⚡ Generate</button>
            </div>
            <textarea rows="4" data-i="${i}" data-k="subtitle" placeholder="Some places remember you, even when no one's there."></textarea>
            <div class="wave-preview" data-wave="${i}"><canvas></canvas></div>
            <div class="wave-controls" data-wavectl="${i}" style="display:${f.audioKey ? "flex" : "none"}">
              <button class="btn tiny" data-action="play-audio" data-i="${i}">▶ Preview</button>
              <button class="btn tiny" data-action="clear-audio" data-i="${i}">Clear</button>
            </div>
          </div>
        </div>
      `;
      row.querySelector('[data-k="description"]').value = f.description;
      row.querySelector('[data-k="subtitle"]').value = f.subtitle;
      framesEl.appendChild(row);
      const canvas = row.querySelector(`[data-wave="${i}"] canvas`);
      drawWaveform(canvas, f.wave);
      if (!f.wave || f.wave.length === 0) {
        canvas.style.display = "none";
        const ph = document.createElement("div");
        ph.className = "placeholder";
        ph.textContent = "Write voiceover → Generate";
        row.querySelector(`[data-wave="${i}"]`).appendChild(ph);
      }
    });
    const total = doc.frames.reduce((s,f)=>s+f.duration, 0);
    summaryLeft.textContent = `${doc.frames.length} frame${doc.frames.length===1?"":"s"} · ${store.active}`;
    summaryRight.textContent = `${total}s total`;
    document.getElementById("totalSec").value = doc.totalSec;
    document.getElementById("frameSec").value = doc.frameSec;
    hydrateImages(framesEl);
  }

  // --- event wiring ---
  // --- drag-and-drop frame reordering ---
  let dragSrcIdx = null;
  framesEl.addEventListener("dragstart", e => {
    const grip = e.target.closest(".grip");
    if (!grip) { e.preventDefault(); return; }
    const frame = grip.closest(".frame");
    dragSrcIdx = parseInt(frame.dataset.frameIdx, 10);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(dragSrcIdx));
    e.dataTransfer.setDragImage(frame, 20, 20);
    frame.classList.add("dragging");
  });
  framesEl.addEventListener("dragover", e => {
    if (dragSrcIdx === null) return;
    const frame = e.target.closest(".frame");
    if (!frame) return;
    e.preventDefault();
    const rect = frame.getBoundingClientRect();
    const before = e.clientX < rect.left + rect.width / 2;
    framesEl.querySelectorAll(".frame").forEach(f => f.classList.remove("drop-before","drop-after"));
    frame.classList.toggle("drop-before", before);
    frame.classList.toggle("drop-after", !before);
  });
  framesEl.addEventListener("dragleave", e => {
    if (!e.target.closest(".frames")) {
      framesEl.querySelectorAll(".frame").forEach(f => f.classList.remove("drop-before","drop-after"));
    }
  });
  framesEl.addEventListener("drop", e => {
    if (dragSrcIdx === null) return;
    const frame = e.target.closest(".frame");
    if (!frame) return;
    e.preventDefault();
    const dropIdx = parseInt(frame.dataset.frameIdx, 10);
    const rect = frame.getBoundingClientRect();
    const before = e.clientX < rect.left + rect.width / 2;
    let insertAt = before ? dropIdx : dropIdx + 1;
    if (insertAt > dragSrcIdx) insertAt -= 1;
    if (insertAt === dragSrcIdx) { cleanupDrag(); return; }
    const doc = activeDoc();
    const [moved] = doc.frames.splice(dragSrcIdx, 1);
    doc.frames.splice(insertAt, 0, moved);
    save(); renderEditor();
    cleanupDrag();
  });
  framesEl.addEventListener("dragend", cleanupDrag);
  function cleanupDrag() {
    dragSrcIdx = null;
    framesEl.querySelectorAll(".frame").forEach(f =>
      f.classList.remove("drop-before","drop-after","dragging")
    );
  }

  framesEl.addEventListener("input", e => {
    const t = e.target;
    const i = +t.dataset.i; const k = t.dataset.k;
    if (Number.isNaN(i) || !k) return;
    const doc = activeDoc();
    if (k === "duration") {
      doc.frames[i].duration = Math.max(0.1, parseFloat(t.value) || 1);
      save(); renderEditor();
    } else {
      doc.frames[i][k] = t.value;
      save();
    }
  });

  framesEl.addEventListener("click", async e => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    const wrap = btn.closest("[data-i],[data-img],[data-wave]");
    let i = btn.dataset.i;
    if (i == null && wrap) i = wrap.dataset.img || wrap.dataset.wave;
    i = +i;
    const doc = activeDoc();
    if (action === "remove") {
      doc.frames.splice(i, 1);
      if (doc.frames.length === 0) doc.frames.push(makeFrame(doc.frameSec));
      save(); renderEditor();
    } else if (action === "gen-image") {
      await handleGenerateImage(i, btn);
    } else if (action === "regen-image") {
      if (doc.frames[i].imageKey) { idbDel(doc.frames[i].imageKey).catch(()=>{}); doc.frames[i].imageKey = ""; }
      const innerBtn = framesEl.querySelector(`[data-action="gen-image"][data-i="${i}"]`);
      await handleGenerateImage(i, innerBtn);
    } else if (action === "clear-image") {
      if (doc.frames[i].imageKey) idbDel(doc.frames[i].imageKey).catch(()=>{});
      doc.frames[i].imageKey = ""; save(); renderEditor();
    } else if (action === "gen-voice") {
      await handleGenerateVoice(i, btn);
    } else if (action === "play-audio") {
      const f = doc.frames[i]; if (!f.audioKey) return;
      const url = await blobUrl(f.audioKey);
      const a = document.getElementById("prevAudio"); a.src = url; a.play();
    } else if (action === "clear-audio") {
      if (doc.frames[i].audioKey) idbDel(doc.frames[i].audioKey).catch(()=>{});
      doc.frames[i].audioKey = ""; doc.frames[i].wave = [];
      save(); renderEditor();
    }
  });

  document.getElementById("addFrame").addEventListener("click", () => {
    const doc = activeDoc();
    doc.frames.push(makeFrame(doc.frameSec));
    save(); renderEditor();
  });
  document.getElementById("applyTiming").addEventListener("click", () => {
    const doc = activeDoc();
    const newTotal = Math.max(1, parseInt(document.getElementById("totalSec").value||"60",10));
    const newFrame = Math.max(1, parseInt(document.getElementById("frameSec").value||"5",10));
    const count = Math.max(1, Math.round(newTotal / newFrame));
    if (!confirm(`Reset "${store.active}" to ${count} blank frames of ${newFrame}s each? This clears generated assets.`)) return;
    doc.totalSec = newTotal; doc.frameSec = newFrame;
    doc.frames = Array.from({length: count}, () => makeFrame(newFrame));
    save(); renderEditor();
  });
  document.getElementById("totalSec").addEventListener("change", e => { activeDoc().totalSec = Math.max(1, parseInt(e.target.value||"60",10)); save(); });
  document.getElementById("frameSec").addEventListener("change", e => { activeDoc().frameSec = Math.max(1, parseInt(e.target.value||"5",10)); save(); });

  docSelect.addEventListener("change", e => { store.active = e.target.value; save(); renderAll(); });

  document.getElementById("newDoc").addEventListener("click", async () => {
    const name = await promptModal("New storyboard", "Name", "");
    if (!name) return;
    const finalName = uniqueName(name.trim());
    store.docs[finalName] = blankDoc();
    store.active = finalName;
    save(); renderAll();
  });
  document.getElementById("renameDoc").addEventListener("click", async () => {
    const current = store.active;
    const name = await promptModal("Rename storyboard", `Currently: "${current}"`, current);
    if (!name || name.trim() === current) return;
    const finalName = uniqueName(name.trim());
    store.docs[finalName] = store.docs[current];
    delete store.docs[current];
    store.active = finalName;
    save(); renderAll();
  });
  document.getElementById("deleteDoc").addEventListener("click", () => {
    const names = Object.keys(store.docs);
    if (names.length <= 1) { alert("Can't delete your only storyboard."); return; }
    if (!confirm(`Delete "${store.active}"? This can't be undone.`)) return;
    delete store.docs[store.active];
    store.active = Object.keys(store.docs).sort()[0];
    save(); renderAll();
  });

  // --- music ---
  document.getElementById("musicPrompt").addEventListener("input", e => {
    activeDoc().musicPrompt = e.target.value; save();
  });
  document.getElementById("genMusic").addEventListener("click", async () => {
    const doc = activeDoc();
    const prompt = (document.getElementById("musicPrompt").value || "").trim();
    if (!prompt) { alert("Write a music prompt first (or hit ✨ Suggest)."); return; }
    if (!settings.elevenKey) { alert("Add your ElevenLabs API key in settings (⚙)."); showSettings(); return; }
    const btn = document.getElementById("genMusic"); btn.disabled = true;
    const mw = document.getElementById("musicWave");
    mw.innerHTML = `<div class="placeholder" style="color:var(--accent)">composing… (this can take ~30s)</div>`;
    try {
      const lengthMs = Math.max(10000, Math.min(300000, doc.frames.reduce((s,f)=>s+f.duration,0) * 1000));
      const blob = await callElevenLabsMusic(prompt, lengthMs);
      if (doc.musicKey) idbDel(doc.musicKey).catch(()=>{});
      const key = newKey("music");
      await idbPut(key, blob);
      doc.musicKey = key;
      doc.musicPrompt = prompt;
      save(); renderMusic();
    } catch (e) {
      console.error(e); alert("Music generation failed: " + e.message);
      renderMusic();
    } finally { btn.disabled = false; }
  });
  document.getElementById("clearMusic").addEventListener("click", () => {
    const doc = activeDoc();
    const audio = document.getElementById("musicAudio");
    audio.pause(); audio.removeAttribute("src");
    if (doc.musicKey) idbDel(doc.musicKey).catch(()=>{});
    doc.musicKey = ""; save(); renderMusic();
  });

  // Music transport
  const musicAudio = document.getElementById("musicAudio");
  const musicPlayPauseBtn = document.getElementById("musicPlayPause");
  musicPlayPauseBtn.addEventListener("click", async () => {
    if (!musicAudio.src) {
      const doc = activeDoc();
      if (!doc.musicKey) return;
      musicAudio.src = await blobUrl(doc.musicKey);
    }
    if (musicAudio.paused) {
      musicAudio.play().catch(()=>{});
    } else {
      musicAudio.pause();
    }
  });
  document.getElementById("musicStop").addEventListener("click", () => {
    musicAudio.pause(); musicAudio.currentTime = 0; updateMusicTime();
  });
  document.getElementById("musicRestart").addEventListener("click", () => {
    musicAudio.currentTime = 0; musicAudio.play().catch(()=>{});
  });
  musicAudio.addEventListener("timeupdate", updateMusicTime);
  musicAudio.addEventListener("play",  () => musicPlayPauseBtn.textContent = "⏸ Pause");
  musicAudio.addEventListener("pause", () => musicPlayPauseBtn.textContent = "▶ Play");
  musicAudio.addEventListener("ended", () => { musicPlayPauseBtn.textContent = "▶ Play"; updateMusicTime(); });
  musicAudio.addEventListener("loadedmetadata", updateMusicTime);

  // Scrub via clicking the waveform
  document.getElementById("musicWave").addEventListener("click", e => {
    if (!musicAudio.src || !isFinite(musicAudio.duration)) return;
    const mw = e.currentTarget;
    const rect = mw.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    musicAudio.currentTime = pct * musicAudio.duration;
    updateMusicTime();
  });

  // --- modal helpers ---
  function showModal(html) {
    const backdrop = document.getElementById("modalBackdrop");
    document.getElementById("modalContent").innerHTML = html;
    backdrop.classList.add("show");
  }
  function hideModal() { document.getElementById("modalBackdrop").classList.remove("show"); }
  function promptModal(title, msg, initial) {
    return new Promise(resolve => {
      showModal(`
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(msg)}</p>
        <input id="modalInput" type="text" />
        <div class="actions">
          <button class="btn ghost" id="modalCancel">Cancel</button>
          <button class="btn primary" id="modalOk">OK</button>
        </div>`);
      const input = document.getElementById("modalInput");
      input.value = initial || "";
      setTimeout(() => { input.focus(); input.select(); }, 10);
      const done = (val) => { hideModal(); resolve(val); };
      document.getElementById("modalOk").addEventListener("click", () => done(input.value));
      document.getElementById("modalCancel").addEventListener("click", () => done(null));
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") done(input.value);
        if (e.key === "Escape") done(null);
      });
    });
  }
  function showSettings() {

    ).join("");
    showModal(`
      <h3>API keys & voice</h3>
      <p>Keys live in your browser only (localStorage). Sent directly to each provider from this page.<br>
        <a href="https://docs.bfl.ai/quick_start/introduction" target="_blank">Get BFL key</a> ·

      <input id="setBflProxy" type="text" placeholder="https://bfl-proxy.your-subdomain.workers.dev" value="${escapeHtml(settings.bflProxyUrl)}" />
      <p style="margin-top:6px;font-size:11px;color:var(--muted)">BFL blocks browser calls. Deploy the proxy in <a href="https://github.com/beardloaf/storyboard/blob/main/bfl-proxy.worker.js" target="_blank">bfl-proxy.worker.js</a> to a free Cloudflare Worker, then paste its URL here.</p>
      <label>ElevenLabs (voice + music)</label>
      <input id="setEleven" type="password" placeholder="xi-…" value="${escapeHtml(settings.elevenKey)}" />
      <label>Voice</label>
      <select id="setVoice">${voiceOpts}</select>
      <label>BFL model</label>
      <select id="setBflModel">
        <option value="flux-pro-1.1" ${settings.bflModel==="flux-pro-1.1"?"selected":""}>flux-pro-1.1 (fast)</option>
        <option value="flux-pro-1.1-ultra" ${settings.bflModel==="flux-pro-1.1-ultra"?"selected":""}>flux-pro-1.1-ultra (higher quality)</option>
      </select>
      <div class="actions">
        <button class="btn ghost" id="modalCancel">Cancel</button>
        <button class="btn primary" id="modalOk">Save</button>
      </div>`);
    document.getElementById("modalOk").addEventListener("click", () => {
      settings.bflKey = document.getElementById("setBfl").value.trim();
      settings.bflProxyUrl = document.getElementById("setBflProxy").value.trim().replace(/\/+$/, "");
      settings.elevenKey = document.getElementById("setEleven").value.trim();
      settings.voiceId = document.getElementById("setVoice").value;
      settings.bflModel = document.getElementById("setBflModel").value;
      saveSettings(); hideModal();
    });
    document.getElementById("modalCancel").addEventListener("click", hideModal);
  }
  document.getElementById("settingsBtn").addEventListener("click", showSettings);

  // --- API calls ---
  async function callBflFlux(prompt) {
    const cinePrompt = `Cinematic film still, anamorphic widescreen, 35mm film grain, natural lighting, shallow depth of field, color graded, photorealistic, atmospheric. ${prompt}`;
    if (!settings.bflProxyUrl) {
      throw new Error("Set BFL Proxy URL in ⚙ API keys — BFL blocks browser calls so a Cloudflare Worker proxy is required. See bfl-proxy.worker.js in the repo for the code and deploy steps.");
    }
    const base = settings.bflProxyUrl.replace(/\/+$/, "");
    const url = `${base}/v1/${settings.bflModel}`;
    const body = settings.bflModel.includes("ultra")
      ? { prompt: cinePrompt, aspect_ratio: "16:9", prompt_upsampling: true, safety_tolerance: 2, output_format: "jpeg", raw: false }
      : { prompt: cinePrompt, width: 1024, height: 576, prompt_upsampling: true, safety_tolerance: 2, output_format: "jpeg" };
    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-key": settings.bflKey, "accept": "application/json" },
        body: JSON.stringify(body)
      });
    } catch (e) {
      throw new Error(`Network error reaching proxy ${base} — check the URL is correct and the Worker is deployed. (${e.message})`);
    }
    if (!res.ok) { const t = await res.text(); throw new Error(`BFL ${res.status}: ${t.slice(0,300)}`); }
    const job = await res.json();
    const pollUrl = job.polling_url || `${base}/v1/get_result?id=${job.id}`;
    const deadline = Date.now() + 120000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 1200));
      let pr;
      try {
        pr = await fetch(pollUrl, { headers: { "x-key": settings.bflKey, "accept": "application/json" } });
      } catch (e) {
        throw new Error(`Network error polling proxy. (${e.message})`);
      }
      if (!pr.ok) { const t = await pr.text(); throw new Error(`BFL poll ${pr.status}: ${t.slice(0,200)}`); }
      const pj = await pr.json();
      if (pj.status === "Ready" && pj.result && pj.result.sample) return pj.result.sample;
      if (pj.status && /error|failed|content_moderated/i.test(pj.status)) {
        throw new Error(`BFL: ${pj.status}${pj.details ? " — " + JSON.stringify(pj.details) : ""}`);
      }
    }
    throw new Error("BFL timed out");
  }

  async function callElevenLabs(text) {
    const url = `https://api.elevenlabs.io/v1/text-to-speech/${settings.voiceId}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "xi-api-key": settings.elevenKey, "Accept": "audio/mpeg" },
      body: JSON.stringify({
        text, model_id: "eleven_multilingual_v2",
        voice_settings: { stability: 0.55, similarity_boost: 0.75, style: 0.15, use_speaker_boost: true }
      })
    });
    if (!res.ok) { const t = await res.text(); throw new Error(`ElevenLabs TTS ${res.status}: ${t.slice(0,300)}`); }
    return res.blob();
  }

  async function callElevenLabsMusic(prompt, lengthMs) {
    // ElevenLabs Music endpoint
    const url = `https://api.elevenlabs.io/v1/music`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "xi-api-key": settings.elevenKey, "Accept": "audio/mpeg" },
      body: JSON.stringify({ prompt, music_length_ms: lengthMs })
    });
    if (!res.ok) {
      const t = await res.text();
      // Fallback to legacy endpoint name if first fails
      if (res.status === 404) {
        const res2 = await fetch(`https://api.elevenlabs.io/v1/music/compose`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "xi-api-key": settings.elevenKey, "Accept": "audio/mpeg" },
          body: JSON.stringify({ prompt, music_length_ms: lengthMs })
        });
        if (!res2.ok) { const t2 = await res2.text(); throw new Error(`ElevenLabs Music ${res2.status}: ${t2.slice(0,300)}`); }
        return res2.blob();
      }
      throw new Error(`ElevenLabs Music ${res.status}: ${t.slice(0,300)}`);
    }
    return res.blob();
  }

  // --- frame generation handlers ---
  async function handleGenerateImage(i, btn) {
    const doc = activeDoc();
    const f = doc.frames[i];
    if (!f.description.trim()) { alert("Write a description first."); return; }
    if (!settings.bflKey) { alert("Add your BFL API key in settings (⚙)."); showSettings(); return; }
    if (btn) btn.disabled = true;
    const preview = document.querySelector(`[data-img="${i}"]`);
    preview.classList.add("loading");
    try {
      const imgUrl = await callBflFlux(f.description);
      const blob = await urlToCompressedBlob(imgUrl, 1280, 0.85);
      if (f.imageKey) idbDel(f.imageKey).catch(()=>{});
      const key = newKey("img");
      await idbPut(key, blob);
      f.imageKey = key; save();
      preview.innerHTML = frameImageHtml(f);
      hydrateImages(preview);
    } catch (e) {
      console.error(e); alert("Image generation failed: " + e.message);
    } finally {
      preview.classList.remove("loading");
      if (btn) btn.disabled = false;
    }
  }
  async function handleGenerateVoice(i, btn) {
    const doc = activeDoc();
    const f = doc.frames[i];
    if (!f.subtitle.trim()) { alert("Write voiceover text first."); return; }
    if (!settings.elevenKey) { alert("Add your ElevenLabs API key in settings (⚙)."); showSettings(); return; }
    btn.disabled = true;
    const preview = document.querySelector(`[data-wave="${i}"]`);
    preview.classList.add("loading");
    try {
      const blob = await callElevenLabs(f.subtitle);
      const { peaks, duration } = await computeWaveform(blob, 96);
      if (f.audioKey) idbDel(f.audioKey).catch(()=>{});
      const key = newKey("audio");
      await idbPut(key, blob);
      f.audioKey = key; f.wave = peaks;
      f.duration = Math.round(duration * 100) / 100;
      save(); renderEditor();
    } catch (e) {
      console.error(e); alert("Voice generation failed: " + e.message);
    } finally {
      preview.classList.remove("loading");
      btn.disabled = false;
    }
  }

  // --- player ---
  const playerEl = document.getElementById("player");
  const playerDesc = document.getElementById("playerDesc");
  const playerSub = document.getElementById("playerSub");
  const playerFrameNo = document.getElementById("playerFrameNo");
  const playerImgStage = document.getElementById("playerImgStage");
  const playerAudio = document.getElementById("playerAudio");
  const playerMusic = document.getElementById("playerMusic");
  const progressBar = document.getElementById("progressBar");
  const timeReadout = document.getElementById("timeReadout");
  const playPauseBtn = document.getElementById("playPauseBtn");

  let playState = { playing:false, idx:0, startedAt:0, elapsedInFrame:0, rafId:null };

  function frames() { return activeDoc().frames; }
  function totalLength() { return frames().reduce((s,f)=>s+f.duration, 0); }
  function elapsedBeforeIdx(idx) { let s=0; for (let i=0;i<idx;i++) s+=frames()[i].duration; return s; }

  async function showFrame(i) {
    const f = frames()[i]; if (!f) return;
    if (f.imageKey) {
      const url = await blobUrl(f.imageKey);
      if (url) playerImgStage.style.backgroundImage = `url("${url}")`;
      playerDesc.classList.remove("fallback");
      playerDesc.style.display = "none";
    } else {
      playerImgStage.style.backgroundImage = "";
      playerDesc.classList.add("fallback");
      playerDesc.textContent = f.description || "(no description)";
      playerDesc.style.display = "";
    }
    playerSub.textContent = f.subtitle || "";
    playerSub.style.display = f.subtitle ? "" : "none";
    playerFrameNo.textContent = `FRAME ${i+1} / ${frames().length}`;
    if (f.audioKey) {
      const url = await blobUrl(f.audioKey);
      playerAudio.src = url; playerAudio.currentTime = 0;
      if (playState.playing) playerAudio.play().catch(()=>{});
    } else {
      playerAudio.removeAttribute("src");
    }
  }

  async function startPlayer() {
    if (frames().length === 0) return;
    playerEl.style.display = "flex";
    playState = { playing:true, idx:0, startedAt:performance.now(), elapsedInFrame:0, rafId:null };
    const doc = activeDoc();
    if (doc.musicKey) {
      const url = await blobUrl(doc.musicKey);
      playerMusic.src = url; playerMusic.volume = 0.45;
      playerMusic.currentTime = 0; playerMusic.play().catch(()=>{});
    } else { playerMusic.removeAttribute("src"); }
    showFrame(0); playPauseBtn.textContent = "⏸ Pause"; tick();
  }
  function stopPlayer() {
    playState.playing = false; cancelAnimationFrame(playState.rafId);
    playerAudio.pause(); playerMusic.pause();
    playerEl.style.display = "none";
  }
  function pause() {
    if (!playState.playing) return;
    playState.elapsedInFrame += (performance.now() - playState.startedAt) / 1000;
    playState.playing = false; cancelAnimationFrame(playState.rafId);
    playerAudio.pause(); playerMusic.pause();
    playPauseBtn.textContent = "▶ Play";
  }
  function resume() {
    if (playState.playing) return;
    playState.playing = true; playState.startedAt = performance.now();
    if (playerAudio.src) playerAudio.play().catch(()=>{});
    if (playerMusic.src) playerMusic.play().catch(()=>{});
    playPauseBtn.textContent = "⏸ Pause"; tick();
  }
  function gotoFrame(i) {
    if (i < 0 || i >= frames().length) return;
    playState.idx = i; playState.elapsedInFrame = 0; playState.startedAt = performance.now();
    showFrame(i);
  }
  function tick() {
    if (!playState.playing) return;
    const f = frames()[playState.idx];
    const hasAudio = !!(f.audioKey && playerAudio.src && isFinite(playerAudio.duration) && playerAudio.duration > 0);
    let inFrame, frameDur;
    if (hasAudio) {
      inFrame = playerAudio.currentTime;
      frameDur = playerAudio.duration;
    } else {
      const now = performance.now();
      inFrame = playState.elapsedInFrame + (now - playState.startedAt) / 1000;
      frameDur = f.duration;
    }
    const total = totalLength();
    const overall = elapsedBeforeIdx(playState.idx) + Math.min(inFrame, frameDur);
    progressBar.style.width = `${(overall/total)*100}%`;
    timeReadout.textContent = `${overall.toFixed(1)}s / ${total.toFixed(1)}s`;
    if (inFrame >= frameDur) {
      if (playState.idx >= frames().length - 1) {
        progressBar.style.width = "100%"; playState.playing = false;
        playerAudio.pause(); playerMusic.pause();
        playPauseBtn.textContent = "↻ Replay"; return;
      }
      playState.idx += 1; playState.elapsedInFrame = 0; playState.startedAt = performance.now();
      showFrame(playState.idx);
    }
    playState.rafId = requestAnimationFrame(tick);
  }

  document.getElementById("playBtn").addEventListener("click", startPlayer);
  document.getElementById("closeBtn").addEventListener("click", stopPlayer);
  document.getElementById("prevBtn").addEventListener("click", () => gotoFrame(playState.idx - 1));
  document.getElementById("nextBtn").addEventListener("click", () => gotoFrame(playState.idx + 1));
  playPauseBtn.addEventListener("click", () => {
    if (playPauseBtn.textContent.startsWith("↻")) { startPlayer(); return; }
    playState.playing ? pause() : resume();
  });
  document.addEventListener("keydown", (e) => {
    if (playerEl.style.display === "none") return;
    if (e.key === "Escape") stopPlayer();
    if (e.key === " ") { e.preventDefault(); playPauseBtn.click(); }
    if (e.key === "ArrowRight") gotoFrame(playState.idx + 1);
    if (e.key === "ArrowLeft") gotoFrame(playState.idx - 1);
  });

  // --- MP4 export ---
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }
  function drawCover(ctx, img, w, h) {
    const iAR = img.width / img.height;
    const cAR = w / h;
    let dw, dh, dx, dy;
    if (iAR > cAR) { dh = h; dw = h * iAR; dx = (w - dw) / 2; dy = 0; }
    else            { dw = w; dh = w / iAR; dx = 0; dy = (h - dh) / 2; }
    ctx.drawImage(img, dx, dy, dw, dh);
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight, anchor = "middle") {
    const words = text.split(/\s+/);
    const lines = []; let line = "";
    for (const word of words) {
      const test = line + (line ? " " : "") + word;
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
      else line = test;
    }
    if (line) lines.push(line);
    let startY;
    if (anchor === "bottom") startY = y - (lines.length - 1) * lineHeight;
    else if (anchor === "top") startY = y;
    else startY = y - (lines.length - 1) * lineHeight / 2;
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], x, startY + i * lineHeight);
    }
    return lines.length;
  }

  function renderExportFrame(ctx, W, H, f) {
    if (f.img) {
      drawCover(ctx, f.img, W, H);
    } else {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      if (f.description) {
        ctx.font = '500 56px -apple-system, "Segoe UI", system-ui, sans-serif';
        ctx.textAlign = "center"; ctx.fillStyle = "#ececec";
        wrapText(ctx, f.description, W/2, H/2, W - 240, 72);
      }
    }
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "rgba(0,0,0,0.45)");
    grad.addColorStop(0.32, "rgba(0,0,0,0)");
    grad.addColorStop(0.68, "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0,0.75)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.font = '500 26px "Roboto Mono", ui-monospace, monospace';
    ctx.textAlign = "left"; ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillText(`FRAME ${f.idx} / ${f.total}`, 56, 76);
    if (f.subtitle) {
      ctx.font = '600 56px -apple-system, "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = "center"; ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0,0,0,0.95)";
      ctx.shadowBlur = 18; ctx.shadowOffsetY = 3;
      wrapText(ctx, f.subtitle, W/2, H - 140, W - 240, 72, "bottom");
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    }
  }

  function showExportStatus(initial) {
    let el = document.getElementById("exportStatus");
    if (!el) {
      el = document.createElement("div");
      el.id = "exportStatus"; el.className = "export-status";
      el.innerHTML = `<span class="label">${initial}</span><div class="bar"><div></div></div><span class="pct">0%</span>`;
      document.body.appendChild(el);
    } else {
      el.querySelector(".label").textContent = initial;
    }
    return el;
  }
  function updateExportStatus(el, label, pct) {
    el.querySelector(".label").textContent = label;
    el.querySelector(".bar > div").style.width = `${pct}%`;
    el.querySelector(".pct").textContent = `${Math.round(pct)}%`;
  }
  function hideExportStatus() {
    const el = document.getElementById("exportStatus");
    if (el) el.remove();
  }

  async function exportStoryboard() {
    const doc = activeDoc();
    if (!doc.frames.length) { alert("No frames to export."); return; }

    const W = 2560, H = 1440, FPS = 30;
    const btn = document.getElementById("downloadBtn");
    btn.disabled = true;
    const status = showExportStatus("Preparing assets…");

    try {
      const total = doc.frames.length;
      // Pre-load all assets
      const frameAssets = [];
      const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < doc.frames.length; i++) {
        updateExportStatus(status, `Loading frame ${i+1} / ${total}…`, (i / total) * 10);
        const f = doc.frames[i];
        let img = null;
        if (f.imageKey) {
          const u = await blobUrl(f.imageKey);
          if (u) { try { img = await loadImage(u); } catch {} }
        }
        let voiceBuf = null;
        if (f.audioKey) {
          const blob = await idbGet(f.audioKey);
          if (blob) {
            try {
              const ab = await blob.arrayBuffer();
              voiceBuf = await decodeCtx.decodeAudioData(ab.slice(0));
            } catch (e) { console.warn("voice decode failed", e); }
          }
        }
        const duration = voiceBuf ? voiceBuf.duration : (f.duration || 1);
        frameAssets.push({
          img, voiceBuf, subtitle: f.subtitle, description: f.description,
          duration, idx: i+1, total
        });
      }

      let musicBuf = null;
      if (doc.musicKey) {
        updateExportStatus(status, "Loading soundtrack…", 12);
        const blob = await idbGet(doc.musicKey);
        if (blob) {
          try {
            const ab = await blob.arrayBuffer();
            musicBuf = await decodeCtx.decodeAudioData(ab.slice(0));
          } catch (e) { console.warn("music decode failed", e); }
        }
      }
      await decodeCtx.close();

      const frameStarts = []; let t = 0;
      for (const a of frameAssets) { frameStarts.push(t); t += a.duration; }
      const totalDuration = t;
      if (totalDuration <= 0) throw new Error("Storyboard has zero duration.");

      // Canvas
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d", { alpha: false });
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

      // Audio mixing
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const dest = audioCtx.createMediaStreamDestination();

      // Streams
      const canvasStream = canvas.captureStream(FPS);
      const stream = new MediaStream([
        canvasStream.getVideoTracks()[0],
        ...dest.stream.getAudioTracks()
      ]);

      const candidates = [
        'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      let mimeType = "";
      for (const c of candidates) { if (MediaRecorder.isTypeSupported(c)) { mimeType = c; break; } }
      if (!mimeType) throw new Error("Browser doesn't support MediaRecorder for video export.");

      const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 10_000_000,
        audioBitsPerSecond: 192_000
      });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      const result = await new Promise((resolve, reject) => {
        recorder.onerror = (e) => reject(new Error("MediaRecorder error: " + (e.error && e.error.message || "unknown")));
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mimeType });
          const ext = mimeType.startsWith("video/mp4") ? "mp4" : "webm";
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${store.active.replace(/[^\w-]+/g, "_")}.${ext}`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          resolve({ ext });
        };

        recorder.start(1000);

        const t0 = audioCtx.currentTime + 0.15;

        if (musicBuf) {
          const src = audioCtx.createBufferSource();
          src.buffer = musicBuf; src.loop = true;
          const gain = audioCtx.createGain();
          gain.gain.value = 0.45;
          src.connect(gain).connect(dest);
          src.start(t0);
          src.stop(t0 + totalDuration);
        }
        for (let i = 0; i < frameAssets.length; i++) {
          const a = frameAssets[i];
          if (a.voiceBuf) {
            const src = audioCtx.createBufferSource();
            src.buffer = a.voiceBuf;
            src.connect(dest);
            src.start(t0 + frameStarts[i]);
          }
        }

        renderExportFrame(ctx, W, H, frameAssets[0]);

        const draw = () => {
          const elapsed = audioCtx.currentTime - t0;
          if (elapsed >= totalDuration) {
            updateExportStatus(status, "Finalizing…", 99);
            setTimeout(() => { try { recorder.stop(); } catch (e) { reject(e); } }, 400);
            return;
          }
          if (elapsed < 0) { requestAnimationFrame(draw); return; }
          let curIdx = 0;
          for (let i = 0; i < frameStarts.length; i++) if (elapsed >= frameStarts[i]) curIdx = i;
          renderExportFrame(ctx, W, H, frameAssets[curIdx]);
          const pct = Math.min(98, (elapsed / totalDuration) * 100);
          updateExportStatus(status, `Rendering · ${elapsed.toFixed(1)}s / ${totalDuration.toFixed(1)}s · frame ${curIdx+1}/${frameAssets.length}`, pct);
          requestAnimationFrame(draw);
        };
        requestAnimationFrame(draw);
      });

      hideExportStatus();
      if (result.ext === "webm") {
        alert("Saved as .webm — your browser doesn't support direct MP4 from MediaRecorder. WebM plays in most modern apps; you can convert with HandBrake or ffmpeg if needed.");
      }
      await audioCtx.close();
    } catch (e) {
      console.error(e);
      alert("Export failed: " + e.message);
      hideExportStatus();
    } finally {
      btn.disabled = false;
    }
  }
  document.getElementById("downloadBtn").addEventListener("click", exportStoryboard);

  function renderAll() { renderDocPicker(); renderMusic(); renderEditor(); }

  // --- init ---
  loadSettings();
  if (!load() || Object.keys(store.docs).length === 0) {
    store.docs["Untitled"] = blankDoc();
    store.active = "Untitled";
    save();
  }
  renderAll();
  migrateInlineToIdb().then(() => renderAll()).catch(e => console.warn("migration failed", e));

  // First-run: prompt for keys if none configured
  if (!settings.bflKey && !settings.bflProxyUrl && !settings.elevenKey) {
    setTimeout(showSettings, 200);
  }

  window.addEventListener("resize", () => {
    const doc = activeDoc();
    doc.frames.forEach((f, i) => {
      const c = document.querySelector(`[data-wave="${i}"] canvas`);
      if (c) drawWaveform(c, f.wave);
    });
  });
})();
</script>
