<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Storyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --panel-2: #1e1e1e;
    --line: #2a2a2a;
    --line-2: #353535;
    --text: #ececec;
    --muted: #8a8a8a;
    --accent: #e9b949;
    --accent-2: #d9d9d9;
    --danger: #ff5d5d;
    --good: #6ed18a;
    --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button { font-family: inherit; }
  input, textarea, select {
    font-family: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent-2); }
  textarea { resize: vertical; }

  .app { min-height: 100%; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; height: 22px; }
  .brand img { max-height: 22px; display: block; }
  .topbar .spacer { flex: 1; }

  .doc-picker { display: flex; align-items: center; gap: 8px; }
  .doc-picker select {
    width: auto; min-width: 180px; padding: 6px 28px 6px 10px; font-size: 13px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px; background-repeat: no-repeat;
    -webkit-appearance: none; appearance: none;
  }

  .config {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 13px;
  }
  .config input[type=number] { width: 60px; padding: 6px 8px; font-size: 13px; }

  .btn {
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer; font-size: 13px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; }
  .btn.icon { padding: 6px 10px; font-size: 13px; }
  .btn.tiny { padding: 4px 8px; font-size: 11px; font-family: var(--mono); letter-spacing: .5px; }
  .btn.danger { color: var(--danger); border-color: transparent; background: transparent; }
  .btn.danger:hover { background: rgba(255,93,93,.08); }

  /* Music + import row */
  .meta-bar {
    max-width: 1200px; margin: 0 auto; width: 100%;
    padding: 20px 24px 0;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px; align-items: end;
  }
  .meta-bar .music {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .meta-bar .music .row { display: flex; gap: 8px; align-items: center; }
  .meta-bar .music input { font-size: 13px; }
  .meta-bar .music .wave-mini {
    height: 36px; background: #050505; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px; position: relative;
  }
  .meta-bar .music .wave-mini canvas { width: 100%; height: 100%; }
  .meta-bar .music .wave-mini .placeholder {
    color: #444; font-family: var(--mono); font-size: 11px;
    display: flex; align-items: center; justify-content: center; height: 100%;
  }
  .meta-bar .actions-side {
    display: flex; flex-direction: column; gap: 8px;
  }

  .label-mono {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--muted); font-weight: 500;
    display: block; margin-bottom: 6px;
  }

  .key-banner {
    max-width: 1200px; margin: 16px auto 0; width: calc(100% - 48px);
    background: rgba(233,185,73,.08); border: 1px solid rgba(233,185,73,.35);
    border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: var(--text);
  }
  .key-banner .grow { flex: 1; }
  .key-banner .missing {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: .5px;
  }

  /* Editor */
  .editor { padding: 16px 24px 24px; max-width: 1200px; margin: 0 auto; width: 100%; }
  .frames { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }

  .frame {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px 16px;
    display: flex; flex-direction: column;
    gap: 12px;
    container-type: inline-size;
  }
  .frame-head {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-family: var(--mono); font-size: 12px;
  }
  .frame-head .num { color: var(--accent); font-weight: 500; }
  .frame-head .spacer { flex: 1; }
  .frame-head .dur { display: flex; align-items: center; gap: 6px; }
  .frame-head .dur input {
    width: 56px; padding: 4px 6px; font-size: 12px; text-align: center;
    font-family: var(--mono);
  }
  .frame-head .remove {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; padding: 4px 6px; font-size: 16px; line-height: 1; border-radius: 6px;
  }
  .frame-head .remove:hover { color: var(--danger); background: rgba(255,93,93,.08); }

  .frame-body {
    display: grid; grid-template-columns: 1fr; gap: 14px;
  }
  @container (min-width: 780px) {
    .frame-body { grid-template-columns: 1fr 1fr; }
  }

  .col { display: flex; flex-direction: column; }
  .col-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .col-head label {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--muted); font-weight: 500;
  }

  /* Image preview */
  .img-preview {
    background: #050505; border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
    aspect-ratio: 16 / 9; margin-bottom: 8px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .img-preview img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .img-preview .placeholder {
    color: #444; font-family: var(--mono); font-size: 11px;
    text-align: center; padding: 0 16px;
  }
  .img-preview.loading::after {
    content: "rendering…"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-family: var(--mono); font-size: 11px;
    background: rgba(5,5,5,.85); letter-spacing: 2px;
  }
  .img-preview .corner {
    position: absolute; top: 6px; right: 6px;
    display: none; gap: 4px;
  }
  .img-preview:hover .corner { display: flex; }
  .img-preview .corner button {
    background: rgba(0,0,0,.7); border: 1px solid var(--line);
    color: var(--text); padding: 3px 6px; border-radius: 4px;
    font-family: var(--mono); font-size: 10px; cursor: pointer;
  }
  .img-preview .corner button:hover { border-color: var(--accent); }

  /* Waveform */
  .wave-preview {
    background: #050505; border: 1px solid var(--line);
    border-radius: 8px; padding: 10px;
    margin-bottom: 8px; height: 80px;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .wave-preview canvas { width: 100%; height: 100%; display: block; }
  .wave-preview .placeholder {
    color: #444; font-family: var(--mono); font-size: 11px;
  }
  .wave-preview.loading::after {
    content: "rendering…"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-family: var(--mono); font-size: 11px;
    background: rgba(5,5,5,.85); letter-spacing: 2px;
  }
  .wave-controls {
    display: flex; gap: 6px; align-items: center; margin-bottom: 8px;
  }

  .col textarea { min-height: 80px; flex: 1; }

  .add-row { display: flex; justify-content: center; padding: 18px 0 8px; }

  .summary {
    color: var(--muted); font-size: 12px; padding: 8px 4px 0;
    display: flex; justify-content: space-between;
    font-family: var(--mono); letter-spacing: .5px;
  }

  /* Player */
  .player {
    position: fixed; inset: 0;
    background: #000;
    display: flex; flex-direction: column; z-index: 100;
  }
  .player .stage {
    flex: 1; position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  .player .img-stage {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-color: #000;
  }
  .player .img-stage::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 35%, transparent 65%, rgba(0,0,0,.4) 100%);
  }
  .player .frameno {
    position: absolute; top: 24px; left: 28px; z-index: 2;
    color: rgba(255,255,255,.7); font-size: 12px;
    font-family: var(--mono); letter-spacing: 2px;
  }
  .player .close { position: absolute; top: 18px; right: 18px; z-index: 2; }
  .player .description {
    position: relative; z-index: 1;
    font-size: clamp(20px, 2.8vw, 32px);
    line-height: 1.25; max-width: 1100px; color: #fff;
    font-weight: 500; padding: 0 4vw;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }
  .player .description.fallback {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  .player .subtitle {
    position: absolute; bottom: 8vh; left: 0; right: 0; z-index: 2;
    font-size: clamp(18px, 2.2vw, 28px);
    color: #fff; max-width: 1000px; margin: 0 auto;
    line-height: 1.4; padding: 0 4vw;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
    font-weight: 500;
  }

  .player .progress { height: 4px; background: rgba(255,255,255,.08); position: relative; z-index: 5; }
  .player .progress .bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); width: 0%;
    transition: width .1s linear;
  }
  .player .controls {
    display: flex; justify-content: center; align-items: center; gap: 14px;
    padding: 16px;
    background: #0a0a0a;
    border-top: 1px solid #1a1a1a; z-index: 5;
  }
  .player .controls .time {
    color: var(--muted); font-variant-numeric: tabular-nums; min-width: 110px; text-align: center;
    font-family: var(--mono);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 22px; min-width: 380px; max-width: 560px;
    width: 92%; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .modal label {
    display: block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px; margin-top: 12px;
  }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal a { color: var(--accent-2); text-decoration: none; }
  .modal a:hover { text-decoration: underline; }
  .dropzone {
    border: 1.5px dashed var(--line-2); border-radius: 10px;
    padding: 30px; text-align: center; color: var(--muted);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: rgba(233,185,73,.04); }
  .dropzone .hint { font-family: var(--mono); font-size: 11px; letter-spacing: .5px; margin-top: 4px; }
  .file-label { font-size: 13px; color: var(--text); margin-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><img src="elmo-fire.gif" alt="elmo" onerror="this.style.display='none'"></div>
    <div class="doc-picker">
      <select id="docSelect" title="Storyboard"></select>
      <button class="btn icon" id="newDoc" title="New storyboard">+</button>
      <button class="btn icon" id="renameDoc" title="Rename">✎</button>
      <button class="btn icon" id="deleteDoc" title="Delete">🗑</button>
    </div>
    <div class="spacer"></div>
    <div class="config">
      <span>Total</span>
      <input id="totalSec" type="number" min="5" step="5" value="60" />
      <span>s · per frame</span>
      <input id="frameSec" type="number" min="1" step="1" value="5" />
      <span>s</span>
      <button class="btn ghost" id="applyTiming">Reset</button>
    </div>
    <button class="btn" id="settingsBtn" title="API keys & voice">⚙ API keys</button>
    <button class="btn primary" id="playBtn">▶ Play</button>
  </div>

  <div id="keyBanner" class="key-banner" style="display:none">
    <div class="grow">
      <strong>Set up your API keys</strong> to generate images, voice, and music.
      <div class="missing" id="keyBannerMissing"></div>
    </div>
    <button class="btn primary" id="keyBannerBtn">⚙ Open settings</button>
  </div>

  <div class="meta-bar">
    <div class="music">
      <span class="label-mono">Soundtrack</span>
      <div class="row">
        <input id="musicPrompt" type="text" placeholder="Cinematic ambient drone, slow strings, melancholic…" />
        <button class="btn" id="suggestMusic" title="Suggest a music prompt from your storyboard">✨ Suggest</button>
        <button class="btn primary" id="genMusic">⚡ Generate</button>
      </div>
      <div class="wave-mini" id="musicWave">
        <div class="placeholder">No track yet. Write a prompt or hit Suggest, then Generate.</div>
      </div>
      <div class="row" id="musicControls" style="display:none">
        <button class="btn tiny" id="previewMusic">▶ Preview</button>
        <button class="btn tiny" id="clearMusic">Clear</button>
      </div>
    </div>
    <div class="actions-side">
      <button class="btn" id="importBtn">📄 Import from document…</button>
    </div>
  </div>

  <div class="editor">
    <div id="frames" class="frames"></div>
    <div class="add-row">
      <button class="btn" id="addFrame">+ Add frame</button>
    </div>
    <div class="summary">
      <div id="summaryLeft">0 frames</div>
      <div id="summaryRight">0s total</div>
    </div>
  </div>
</div>

<div class="player" id="player" style="display:none">
  <div class="stage">
    <div class="img-stage" id="playerImgStage"></div>
    <div class="frameno" id="playerFrameNo"></div>
    <button class="btn close" id="closeBtn">Close ✕</button>
    <div class="description" id="playerDesc"></div>
    <div class="subtitle" id="playerSub"></div>
    <audio id="playerAudio"></audio>
    <audio id="playerMusic" loop></audio>
  </div>
  <div class="progress"><div class="bar" id="progressBar"></div></div>
  <div class="controls">
    <button class="btn" id="prevBtn">⏮ Prev</button>
    <button class="btn primary" id="playPauseBtn">⏸ Pause</button>
    <button class="btn" id="nextBtn">Next ⏭</button>
    <div class="time" id="timeReadout">0.0s / 0.0s</div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<audio id="prevAudio"></audio>

<script>
(() => {
  // --- pdf.js worker ---
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";
  }

  const STORAGE_KEY = "storyboard.v4";
  const SETTINGS_KEY = "storyboard.settings.v2";

  const ELEVEN_VOICES = [
    { id: "pNInz6obpgDQGcFmaJgB", name: "Adam — deep, smooth" },
    { id: "ErXwobaYiN019PkySvjV", name: "Antoni — warm, well-rounded" },
    { id: "TxGEqnHWrfWFTfGW9XjX", name: "Josh — young, deep" },
    { id: "VR6AewLTigWG4xSOukaG", name: "Arnold — crisp" },
    { id: "yoZ06aMxZJJ28mfd3POQ", name: "Sam — raspy" },
    { id: "onwK4e9ZLuTAKqWW03F9", name: "Daniel — narration" }
  ];

  let store = { active: "Untitled", docs: {} };
  let settings = {
    bflKey: "",
    elevenKey: "",
    anthropicKey: "",
    voiceId: "pNInz6obpgDQGcFmaJgB",
    bflModel: "flux-pro-1.1"
  };

  function blankDoc() {
    const totalSec = 60, frameSec = 5;
    const count = Math.round(totalSec / frameSec);
    return {
      totalSec, frameSec,
      music: "", musicPrompt: "",
      frames: Array.from({length: count}, () => makeFrame(frameSec))
    };
  }
  function makeFrame(duration) {
    return { description:"", subtitle:"", duration, image:"", audio:"", wave:[] };
  }
  function uniqueName(base) {
    if (!store.docs[base]) return base;
    let i = 2;
    while (store.docs[`${base} ${i}`]) i++;
    return `${base} ${i}`;
  }
  function activeDoc() { return store.docs[store.active]; }

  // --- persistence ---
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    catch (e) {
      console.warn("storage full", e);
      alert("Storage full — try clearing generated assets or deleting an old storyboard.");
    }
  }
  function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
  function loadSettings() {
    try { const raw = localStorage.getItem(SETTINGS_KEY); if (raw) Object.assign(settings, JSON.parse(raw)); } catch {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && data.docs && data.active && data.docs[data.active]) {
          store = data;
          for (const k of Object.keys(store.docs)) {
            const d = store.docs[k];
            if (d.music == null) d.music = "";
            if (d.musicPrompt == null) d.musicPrompt = "";
            for (const f of d.frames) {
              if (f.image == null) f.image = "";
              if (f.audio == null) f.audio = "";
              if (f.wave == null) f.wave = [];
            }
          }
          return true;
        }
      }
    } catch {}
    return false;
  }

  // --- helpers ---
  function escapeHtml(s) {
    return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function formatTime(s) {
    const m = Math.floor(s/60); const r = s%60;
    return `${m}:${String(r).padStart(2,"0")}`;
  }
  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  async function urlToCompressedDataUrl(url, maxWidth = 1280, quality = 0.85) {
    const res = await fetch(url);
    const blob = await res.blob();
    const img = new Image();
    const objUrl = URL.createObjectURL(blob);
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = objUrl; });
    const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
    const w = Math.round(img.width * ratio);
    const h = Math.round(img.height * ratio);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(objUrl);
    return canvas.toDataURL("image/jpeg", quality);
  }
  async function computeWaveform(blob, bins = 96) {
    const buf = await blob.arrayBuffer();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ac = new Ctx();
    const decoded = await ac.decodeAudioData(buf.slice(0));
    const ch = decoded.getChannelData(0);
    const samplesPerBin = Math.floor(ch.length / bins);
    const peaks = [];
    let globalMax = 0;
    for (let i = 0; i < bins; i++) {
      let max = 0;
      const start = i * samplesPerBin;
      const end = start + samplesPerBin;
      for (let j = start; j < end; j++) {
        const v = Math.abs(ch[j]);
        if (v > max) max = v;
      }
      peaks.push(max);
      if (max > globalMax) globalMax = max;
    }
    if (globalMax > 0) for (let i = 0; i < peaks.length; i++) peaks[i] /= globalMax;
    ac.close();
    return peaks;
  }
  function drawWaveform(canvas, peaks) {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0) { requestAnimationFrame(() => drawWaveform(canvas, peaks)); return; }
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, rect.width, rect.height);
    if (!peaks || peaks.length === 0) return;
    const mid = rect.height / 2;
    const barWidth = rect.width / peaks.length;
    const barPad = Math.max(0.5, barWidth * 0.25);
    ctx.fillStyle = "#e9b949";
    peaks.forEach((p, i) => {
      const h = Math.max(1, p * (rect.height - 4));
      ctx.fillRect(i * barWidth + barPad/2, mid - h/2, Math.max(1, barWidth - barPad), h);
    });
  }

  async function readPdf(file) {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = "";
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      out += tc.items.map(it => it.str).join(" ") + "\n\n";
    }
    return out;
  }
  async function generateStoryboardFromText(text, totalSec, frameSec) {
    const count = Math.max(1, Math.round(totalSec / frameSec));
    const sys = `You convert source material into a cinematic storyboard. Output ONLY JSON, no preamble, no code fences.

Schema:
{
  "frames": [
    { "description": "Visual description of what is seen on screen, 1-2 sentences, concrete and cinematic, suitable for a text-to-image model. Avoid abstract or metaphorical language.",
      "subtitle":    "Voice-over text the viewer hears (one short line). Conversational, in plain English." }
  ]
}

Constraints:
- Produce exactly ${count} frames.
- Each frame represents ${frameSec} seconds.
- The story must flow coherently across frames.
- Descriptions are concrete visuals (subject, setting, lighting, camera). The viewer should be able to picture each.
- Subtitles are short — typically <= ${Math.max(8, Math.round(frameSec * 2.5))} words so they fit the duration.`;
    const userMsg = `Source material:\n${text.slice(0, 50000)}\n\nProduce the JSON now.`;
    const raw = await callClaude(sys, userMsg, "claude-sonnet-4-6");
    const jsonText = raw.replace(/^```(?:json)?\n?/i, "").replace(/```\s*$/, "").trim();
    const parsed = JSON.parse(jsonText);
    parsed.frames = parsed.frames.map(f => ({
      description: String(f.description||""),
      subtitle: String(f.subtitle||""),
      duration: frameSec,
      image:"", audio:"", wave:[]
    }));
    return { totalSec, frameSec, music:"", musicPrompt:"", frames: parsed.frames };
  }

  // --- API calls ---
  async function callClaude(system, userMsg, model = "claude-haiku-4-5") {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "x-api-key": settings.anthropicKey
      },
      body: JSON.stringify({
        model, max_tokens: 8000, system,
        messages: [{ role: "user", content: userMsg }]
      })
    });
    if (!res.ok) {
      const t = await res.text();
      throw new Error(`Claude ${res.status}: ${t.slice(0,300)}`);
    }
    const data = await res.json();
    return data.content?.[0]?.text || "";
  }

  async function callBflFlux(prompt) {
    const cinePrompt = `Cinematic film still, anamorphic widescreen, 35mm film grain, natural lighting, shallow depth of field, color graded, photorealistic, atmospheric. ${prompt}`;
    const url = `https://api.bfl.ai/v1/${settings.bflModel}`;
    const body = settings.bflModel.includes("ultra")
      ? { prompt: cinePrompt, aspect_ratio: "16:9", prompt_upsampling: true, safety_tolerance: 2, output_format: "jpeg", raw: false }
      : { prompt: cinePrompt, width: 1024, height: 576, prompt_upsampling: true, safety_tolerance: 2, output_format: "jpeg" };
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-key": settings.bflKey, "accept": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) { const t = await res.text(); throw new Error(`BFL ${res.status}: ${t.slice(0,300)}`); }
    const job = await res.json();
    const pollUrl = job.polling_url || `https://api.bfl.ai/v1/get_result?id=${job.id}`;
    const deadline = Date.now() + 120000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 1200));
      const pr = await fetch(pollUrl, { headers: { "x-key": settings.bflKey, "accept": "application/json" } });
      if (!pr.ok) { const t = await pr.text(); throw new Error(`BFL poll ${pr.status}: ${t.slice(0,200)}`); }
      const pj = await pr.json();
      if (pj.status === "Ready" && pj.result && pj.result.sample) return pj.result.sample;
      if (pj.status && /error|failed|content_moderated/i.test(pj.status)) {
        throw new Error(`BFL: ${pj.status}${pj.details ? " — " + JSON.stringify(pj.details) : ""}`);
      }
    }
    throw new Error("BFL timed out");
  }

  async function callElevenLabs(text) {
    const url = `https://api.elevenlabs.io/v1/text-to-speech/${settings.voiceId}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "xi-api-key": settings.elevenKey, "Accept": "audio/mpeg" },
      body: JSON.stringify({
        text, model_id: "eleven_multilingual_v2",
        voice_settings: { stability: 0.55, similarity_boost: 0.75, style: 0.15, use_speaker_boost: true }
      })
    });
    if (!res.ok) { const t = await res.text(); throw new Error(`ElevenLabs TTS ${res.status}: ${t.slice(0,300)}`); }
    return res.blob();
  }

  async function callElevenLabsMusic(prompt, lengthMs) {
    // ElevenLabs Music endpoint
    const url = `https://api.elevenlabs.io/v1/music`;

      method: "POST",

      body: JSON.stringify({ prompt, music_length_ms: lengthMs })
    });
    if (!res.ok) {
      const t = await res.text();
      // Fallback to legacy endpoint name if first fails
      if (res.status === 404) {
        const res2 = await fetch(`https://api.elevenlabs.io/v1/music/compose`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "xi-api-key": settings.elevenKey, "Accept": "audio/mpeg" },
          body: JSON.stringify({ prompt, music_length_ms: lengthMs })
        });
        if (!res2.ok) { const t2 = await res2.text(); throw new Error(`ElevenLabs Music ${res2.status}: ${t2.slice(0,300)}`); }
        return res2.blob();
      }
      throw new Error(`ElevenLabs Music ${res.status}: ${t.slice(0,300)}`);
    }
    return res.blob();
  }

  // --- frame generation handlers ---
  async function handleGenerateImage(i, btn) {
    const doc = activeDoc();
    const f = doc.frames[i];
    if (!f.description.trim()) { alert("Write a description first."); return; }
    if (!settings.bflKey) { alert("Add your BFL API key in settings (⚙)."); showSettings(); return; }
    if (btn) btn.disabled = true;
    const preview = document.querySelector(`[data-img="${i}"]`);
    preview.classList.add("loading");
    try {
      const imgUrl = await callBflFlux(f.description);
      const dataUrl = await urlToCompressedDataUrl(imgUrl, 1280, 0.85);
      f.image = dataUrl; save();
      preview.innerHTML = frameImageHtml(f);
    } catch (e) {
      console.error(e); alert("Image generation failed: " + e.message);
    } finally {
      preview.classList.remove("loading");
      if (btn) btn.disabled = false;
    }
  }
  async function handleGenerateVoice(i, btn) {
    const doc = activeDoc();
    const f = doc.frames[i];
    if (!f.subtitle.trim()) { alert("Write voiceover text first."); return; }
    if (!settings.elevenKey) { alert("Add your ElevenLabs API key in settings (⚙)."); showSettings(); return; }
    btn.disabled = true;
    const preview = document.querySelector(`[data-wave="${i}"]`);
    preview.classList.add("loading");
    try {
      const blob = await callElevenLabs(f.subtitle);
      const dataUrl = await blobToDataUrl(blob);
      const peaks = await computeWaveform(blob, 96);
      f.audio = dataUrl; f.wave = peaks;
      save(); renderEditor();
    } catch (e) {
      console.error(e); alert("Voice generation failed: " + e.message);
    } finally {
      preview.classList.remove("loading");
      btn.disabled = false;
    }
  }

  // --- player ---
  const playerEl = document.getElementById("player");
  const playerDesc = document.getElementById("playerDesc");
  const playerSub = document.getElementById("playerSub");
  const playerFrameNo = document.getElementById("playerFrameNo");
  const playerImgStage = document.getElementById("playerImgStage");
  const playerAudio = document.getElementById("playerAudio");
  const playerMusic = document.getElementById("playerMusic");
  const progressBar = document.getElementById("progressBar");
  const timeReadout = document.getElementById("timeReadout");
  const playPauseBtn = document.getElementById("playPauseBtn");

  let playState = { playing:false, idx:0, startedAt:0, elapsedInFrame:0, rafId:null };

  function frames() { return activeDoc().frames; }
  function totalLength() { return frames().reduce((s,f)=>s+f.duration, 0); }
  function elapsedBeforeIdx(idx) { let s=0; for (let i=0;i<idx;i++) s+=frames()[i].duration; return s; }

  function showFrame(i) {
    const f = frames()[i]; if (!f) return;
    if (f.image) {
      playerImgStage.style.backgroundImage = `url("${f.image}")`;
      playerDesc.classList.remove("fallback");
      playerDesc.style.display = "none";
    } else {
      playerImgStage.style.backgroundImage = "";
      playerDesc.classList.add("fallback");
      playerDesc.textContent = f.description || "(no description)";
      playerDesc.style.display = "";
    }
    playerSub.textContent = f.subtitle || "";
    playerSub.style.display = f.subtitle ? "" : "none";
    playerFrameNo.textContent = `FRAME ${i+1} / ${frames().length}`;
    if (f.audio) {
      playerAudio.src = f.audio; playerAudio.currentTime = 0;
      if (playState.playing) playerAudio.play().catch(()=>{});
    } else {
      playerAudio.removeAttribute("src");
    }
  }

  function startPlayer() {
    if (frames().length === 0) return;
    playerEl.style.display = "flex";
    playState = { playing:true, idx:0, startedAt:performance.now(), elapsedInFrame:0, rafId:null };
    const doc = activeDoc();
    if (doc.music) {
      playerMusic.src = doc.music; playerMusic.volume = 0.45;
      playerMusic.currentTime = 0; playerMusic.play().catch(()=>{});
    } else { playerMusic.removeAttribute("src"); }
    showFrame(0); playPauseBtn.textContent = "⏸ Pause"; tick();
  }
  function stopPlayer() {
    playState.playing = false; cancelAnimationFrame(playState.rafId);
    playerAudio.pause(); playerMusic.pause();
    playerEl.style.display = "none";
  }
  function pause() {
    if (!playState.playing) return;
    playState.elapsedInFrame += (performance.now() - playState.startedAt) / 1000;
    playState.playing = false; cancelAnimationFrame(playState.rafId);
    playerAudio.pause(); playerMusic.pause();
    playPauseBtn.textContent = "▶ Play";
  }
  function resume() {
    if (playState.playing) return;
    playState.playing = true; playState.startedAt = performance.now();
    if (playerAudio.src) playerAudio.play().catch(()=>{});
    if (playerMusic.src) playerMusic.play().catch(()=>{});
    playPauseBtn.textContent = "⏸ Pause"; tick();
  }
  function gotoFrame(i) {
    if (i < 0 || i >= frames().length) return;
    playState.idx = i; playState.elapsedInFrame = 0; playState.startedAt = performance.now();
    showFrame(i);
  }
  function tick() {
    if (!playState.playing) return;
    const f = frames()[playState.idx];
    const now = performance.now();
    const inFrame = playState.elapsedInFrame + (now - playState.startedAt) / 1000;
    const total = totalLength();
    const overall = elapsedBeforeIdx(playState.idx) + Math.min(inFrame, f.duration);
    progressBar.style.width = `${(overall/total)*100}%`;
    timeReadout.textContent = `${overall.toFixed(1)}s / ${total.toFixed(1)}s`;
    if (inFrame >= f.duration) {
      if (playState.idx >= frames().length - 1) {
        progressBar.style.width = "100%"; playState.playing = false;
        playerAudio.pause(); playerMusic.pause();
        playPauseBtn.textContent = "↻ Replay"; return;
      }
      playState.idx += 1; playState.elapsedInFrame = 0; playState.startedAt = performance.now();
      showFrame(playState.idx);
    }
    playState.rafId = requestAnimationFrame(tick);
  }

  document.getElementById("playBtn").addEventListener("click", startPlayer);
  document.getElementById("closeBtn").addEventListener("click", stopPlayer);
  document.getElementById("prevBtn").addEventListener("click", () => gotoFrame(playState.idx - 1));
  document.getElementById("nextBtn").addEventListener("click", () => gotoFrame(playState.idx + 1));
  playPauseBtn.addEventListener("click", () => {
    if (playPauseBtn.textContent.startsWith("↻")) { startPlayer(); return; }
    playState.playing ? pause() : resume();
  });
  document.addEventListener("keydown", (e) => {
    if (playerEl.style.display === "none") return;
    if (e.key === "Escape") stopPlayer();
    if (e.key === " ") { e.preventDefault(); playPauseBtn.click(); }
    if (e.key === "ArrowRight") gotoFrame(playState.idx + 1);
    if (e.key === "ArrowLeft") gotoFrame(playState.idx - 1);
  });

  function renderKeyBanner() {
    const missing = [];
    if (!settings.bflKey) missing.push("BFL (images)");
    if (!settings.elevenKey) missing.push("ElevenLabs (voice + music)");
    if (!settings.anthropicKey) missing.push("Anthropic (document import)");
    const banner = document.getElementById("keyBanner");
    if (missing.length === 0) { banner.style.display = "none"; return; }
    banner.style.display = "flex";
    document.getElementById("keyBannerMissing").textContent = "Missing: " + missing.join(" · ");
  }
  document.getElementById("keyBannerBtn").addEventListener("click", showSettings);

  function renderAll() { renderDocPicker(); renderMusic(); renderEditor(); renderKeyBanner(); }

  // --- init ---
  loadSettings();
  if (!load() || Object.keys(store.docs).length === 0) {
    store.docs["Untitled"] = blankDoc();
    store.active = "Untitled";
    save();
  }
  renderAll();

  // First-run: prompt for keys if none configured
  if (!settings.bflKey && !settings.elevenKey && !settings.anthropicKey) {
    setTimeout(showSettings, 200);
  }

  window.addEventListener("resize", () => {
    const doc = activeDoc();
    doc.frames.forEach((f, i) => {
      const c = document.querySelector(`[data-wave="${i}"] canvas`);
      if (c) drawWaveform(c, f.wave);
    });
  });
})();
</script>
</body>
</html>
