<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Elmo's Hotstuff</title>
<link rel="icon" type="image/gif" href="elmo-fire.gif">
<link rel="apple-touch-icon" href="elmo-fire.gif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --panel-2: #1e1e1e;
    --line: #2a2a2a;
    --line-2: #353535;
    --text: #ececec;
    --muted: #8a8a8a;
    --accent: #4d7c5a;          /* hunter green */
    --accent-soft: #5f9170;     /* lighter for hover / highlights */
    --accent-rgb: 77, 124, 90;
    --accent-2: #d9d9d9;
    --danger: #ff5d5d;
    --good: #6ed18a;
    --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button { font-family: inherit; }
  input, textarea, select {
    font-family: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    outline: none;
    width: 100%;
    transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; }

  .app {
    min-height: 100%;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
  }
  main {
    min-width: 0;
    padding: 28px 32px 40px;
  }

  /* Floating right panel */
  .side-panel {
    position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 28px 24px 32px;
    display: flex; flex-direction: column;
    gap: 24px;
  }
  .side-panel .section {
    display: flex; flex-direction: column; gap: 12px;
  }
  .side-panel .section.music {
    flex: 1; min-height: 0;
  }
  .side-panel .section-divider {
    height: 1px; background: var(--line); margin: 6px -6px;
  }
  .brand { display: flex; align-items: center; height: 22px; }
  .brand img { max-height: 22px; display: block; }

  .doc-picker { display: flex; align-items: center; gap: 6px; }
  .doc-picker select {
    flex: 1; min-width: 0; padding: 8px 30px 8px 14px; font-size: 13px; border-radius: 999px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px; background-repeat: no-repeat;
    -webkit-appearance: none; appearance: none;
  }

  .config {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 12px;
    flex-wrap: wrap;
  }
  .config input[type=number] {
    width: 62px; padding: 7px 12px; font-size: 13px; border-radius: 999px; text-align: center;
  }

  .panel-play, .panel-download {
    width: 100%; justify-content: center;
    padding: 14px 20px; font-size: 14px;
    border-radius: 999px;
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .side-panel {
      position: static; height: auto;
      border-right: none; border-bottom: 1px solid var(--line);
    }
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer; font-size: 13px;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { border-color: var(--accent-soft); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent); color: #f6f9f6; border-color: var(--accent); font-weight: 600;
  }
  .btn.primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
  .btn.ghost { background: transparent; }
  .btn.icon {
    padding: 0; width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; border-radius: 999px;
  }
  .btn.tiny {
    padding: 4px 12px; font-size: 11px; font-family: var(--mono);
    letter-spacing: .5px; border-radius: 999px;
  }
  .btn.danger { color: var(--danger); border-color: transparent; background: transparent; }
  .btn.danger:hover { background: rgba(255,93,93,.08); }

  /* Music section (inside side panel) */
  .music { display: flex; flex-direction: column; gap: 8px; }
  .music .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .music input { font-size: 13px; }
  .music .wave-mini {
    height: 56px; background: #050505; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px; position: relative;
    overflow: hidden;
  }
  .music .wave-mini.has-audio { cursor: pointer; }
  .music .wave-mini canvas { width: 100%; height: 100%; position: relative; z-index: 1; }
  .music .wave-mini .placeholder {
    color: #444; font-family: var(--mono); font-size: 10px;
    display: flex; align-items: center; justify-content: center; height: 100%;
    text-align: center; padding: 0 8px;
  }
  .music .wave-mini .progress-overlay {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: rgba(var(--accent-rgb),.22);
    border-right: 2px solid var(--accent);
    width: 0%; pointer-events: none; z-index: 2;
    transition: width .08s linear;
  }
  .music-time {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
  }

  .label-mono {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--muted); font-weight: 500;
    display: block; margin-bottom: 6px;
  }


  .kbd-hint {
    margin-left: 6px; font-family: var(--mono); font-size: 10px;
    color: var(--muted); letter-spacing: .5px;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; vertical-align: 1px;
  }

  .main-actions {
    display: flex; justify-content: flex-end; align-items: center;
    gap: 8px; margin-bottom: 20px;
  }

  /* Editor */
  .editor { width: 100%; }
  .frames {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }
  @media (max-width: 1180px) {
    .frames { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .frames { grid-template-columns: 1fr; }
  }

  .frame {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 18px;
    display: flex; flex-direction: column;
    gap: 12px;
    position: relative;
    transition: opacity .15s, transform .15s;
    min-width: 0;
  }
  .frame.dragging { opacity: .35; }
  .frame.drop-before::before,
  .frame.drop-after::after {
    content: ""; position: absolute; top: 6px; bottom: 6px;
    width: 3px; background: var(--accent); border-radius: 2px;
    pointer-events: none;
  }
  .frame.drop-before::before { left: -8px; }
  .frame.drop-after::after { right: -8px; }
  .frame-head {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-family: var(--mono); font-size: 11px;
  }
  .frame-head .grip {
    cursor: grab; user-select: none;
    color: #555; font-size: 12px; line-height: 1;
    padding: 2px; margin-left: -2px;
    letter-spacing: -2px;
  }
  .frame-head .grip:hover { color: var(--accent); }
  .frame-head .grip:active { cursor: grabbing; }
  .frame-head .num { color: var(--accent); font-weight: 500; }
  .frame-head .spacer { flex: 1; }
  .frame-head .dur { display: flex; align-items: center; gap: 4px; font-size: 10px; }
  .frame-head .dur input {
    width: 66px; padding: 4px 8px; font-size: 11px; text-align: center;
    font-family: var(--mono); border-radius: 999px;
  }
  .frame-head .remove {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 5px; font-size: 14px; line-height: 1; border-radius: 6px;
  }
  .frame-head .remove:hover { color: var(--danger); background: rgba(255,93,93,.08); }

  .frame-body {
    display: flex; flex-direction: column; gap: 8px;
  }

  .col { display: flex; flex-direction: column; }
  .col-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .col-head label {
    font-family: var(--mono); font-size: 9px; text-transform: uppercase;
    letter-spacing: 1.4px; color: var(--muted); font-weight: 500;
  }
  .col-head .btn.tiny { padding: 3px 8px; font-size: 10px; }
  .col-head-actions { display: flex; gap: 4px; }

  /* Image preview */
  .img-preview {
    background: #050505; border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden;
    aspect-ratio: 16 / 9; margin-bottom: 0;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .img-preview img,
  .img-preview video {
    width: 100%; height: 100%; object-fit: cover; display: block;
    background: #050505;
  }
  .img-preview .placeholder {
    color: #444; font-family: var(--mono); font-size: 10px;
    text-align: center; padding: 0 8px; line-height: 1.5;
  }
  .img-preview.loading::after {
    content: "rendering…"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-family: var(--mono); font-size: 11px;
    background: rgba(5,5,5,.85); letter-spacing: 2px;
  }
  .img-preview .corner {
    position: absolute; top: 6px; right: 6px;
    display: none; gap: 4px;
  }
  .img-preview:hover .corner { display: flex; }
  .img-preview .corner button {
    background: rgba(0,0,0,.7); border: 1px solid var(--line);
    color: var(--text); padding: 3px 6px; border-radius: 4px;
    font-family: var(--mono); font-size: 10px; cursor: pointer;
  }
  .img-preview .corner button:hover { border-color: var(--accent); }

  .img-preview.drag-over-file {
    border-color: var(--accent); border-style: dashed;
  }
  .img-preview.drag-over-file::after {
    content: "Drop to upload";
    position: absolute; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    background: rgba(var(--accent-rgb), .25);
    color: #fff;
    font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
    pointer-events: none;
  }

  /* Image version counter */
  .img-preview .img-counter {
    position: absolute; bottom: 8px; left: 8px; z-index: 2;
    display: flex; align-items: center; gap: 2px;
    background: rgba(0,0,0,.72);
    border-radius: 999px;
    padding: 3px 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: rgba(255,255,255,.9);
    backdrop-filter: blur(6px);
  }
  .img-preview .img-counter button {
    background: transparent; border: none; color: inherit;
    width: 20px; height: 20px; border-radius: 999px;
    cursor: pointer; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
  }
  .img-preview .img-counter button:hover:not(:disabled) { background: rgba(255,255,255,.14); color: #fff; }
  .img-preview .img-counter button:disabled { opacity: .35; cursor: default; }
  .img-preview .img-counter .count { padding: 0 5px; letter-spacing: .5px; }

  /* Waveform */
  .wave-preview {
    background: #050505; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px;
    margin-bottom: 0;
    height: 56px;
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .wave-preview canvas { width: 100%; height: 100%; display: block; }
  .wave-preview .placeholder {
    color: #444; font-family: var(--mono); font-size: 10px;
    text-align: center; padding: 0 8px;
  }
  .wave-preview.loading::after {
    content: "rendering…"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-family: var(--mono); font-size: 11px;
    background: rgba(5,5,5,.85); letter-spacing: 2px;
  }
  .wave-controls {
    display: flex; gap: 4px; align-items: center; margin: 0;
  }
  .wave-controls .btn.tiny { padding: 3px 6px; font-size: 10px; }

  .col textarea {
    min-height: 92px; flex: none;
    padding: 8px 10px; font-size: 13px;
    line-height: 1.45;
  }
  #musicPrompt {
    flex: 1; min-height: 120px; resize: none;
    font-size: 13px; line-height: 1.45;
  }

  .add-row { display: flex; justify-content: center; padding: 18px 0 8px; }

  .summary {
    color: var(--muted); font-size: 12px; padding: 8px 4px 0;
    display: flex; justify-content: space-between;
    font-family: var(--mono); letter-spacing: .5px;
  }

  /* Player */
  .player {
    position: fixed; inset: 0;
    background: #000;
    display: flex; flex-direction: column; z-index: 100;
  }
  .player .stage {
    flex: 1; position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  .player .img-stage {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-color: #000;
  }
  .player .img-stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    display: none;
  }
  .player .img-stage.has-video video { display: block; }
  .player .img-stage::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 35%, transparent 65%, rgba(0,0,0,.4) 100%);
  }
  .player .frameno {
    position: absolute; top: 24px; left: 28px; z-index: 2;
    color: rgba(255,255,255,.7); font-size: 12px;
    font-family: var(--mono); letter-spacing: 2px;
  }
  .player .close { position: absolute; top: 18px; right: 18px; z-index: 2; }
  .player .description {
    position: relative; z-index: 1;
    font-size: clamp(20px, 2.8vw, 32px);
    line-height: 1.25; max-width: 1100px; color: #fff;
    font-weight: 500; padding: 0 4vw;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }
  .player .description.fallback {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  .player .subtitle {
    position: absolute; bottom: 8vh; left: 0; right: 0; z-index: 2;
    font-size: clamp(18px, 2.2vw, 28px);
    color: #fff; max-width: 1000px; margin: 0 auto;
    line-height: 1.4; padding: 0 4vw;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
    font-weight: 500;
  }

  .player .progress { height: 4px; background: rgba(255,255,255,.08); position: relative; z-index: 5; }
  .player .progress .bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); width: 0%;
    transition: width .1s linear;
  }
  .player .controls {
    display: flex; justify-content: center; align-items: center; gap: 14px;
    padding: 16px;
    background: #0a0a0a;
    border-top: 1px solid #1a1a1a; z-index: 5;
  }
  .player .controls .time {
    color: var(--muted); font-variant-numeric: tabular-nums; min-width: 110px; text-align: center;
    font-family: var(--mono);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 200;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 28px; min-width: 380px; max-width: 560px;
    width: 92%; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .modal label {
    display: block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted);
    margin-bottom: 6px; margin-top: 12px;
  }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal a { color: var(--accent-2); text-decoration: none; }
  .modal a:hover { text-decoration: underline; }

  /* Shared-view (view-only) landing */
  .share-view {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center; gap: 20px;
  }
  .share-view .brand img { max-height: 28px; }
  .share-view h1 {
    margin: 0; font-size: clamp(28px, 4vw, 44px);
    font-weight: 600; letter-spacing: -0.5px;
  }
  .share-view .meta {
    color: var(--muted); font-family: var(--mono); font-size: 12px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .share-view .play-cta {
    padding: 16px 32px; font-size: 16px; margin-top: 12px;
  }
  .share-view .footer {
    margin-top: 32px; font-size: 12px; color: var(--muted);
  }
  .share-view .footer a { color: var(--accent-soft); text-decoration: none; }
  .share-view .footer a:hover { text-decoration: underline; }
  .share-loading {
    color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
  }

  /* Export progress */
  .export-status {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--accent);
    border-radius: 10px; padding: 14px 22px;
    font-family: var(--mono); font-size: 13px;
    z-index: 300; color: var(--text);
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 14px;
    min-width: 360px;
  }
  .export-status .label { white-space: nowrap; }
  .export-status .bar {
    flex: 1; height: 4px; background: rgba(255,255,255,.08);
    border-radius: 2px; overflow: hidden;
  }
  .export-status .bar > div {
    height: 100%; background: var(--accent); width: 0%;
    transition: width .15s linear;
  }
  .export-status .pct { font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
</style>
</head>
<body>
<div class="app">
  <aside class="side-panel">
    <div class="section">
      <div class="brand"><img src="elmo-fire.gif" alt="elmo" onerror="this.style.display='none'"></div>
    </div>

    <div class="section">
      <span class="label-mono">Storyboard</span>
      <div class="doc-picker">
        <select id="docSelect" title="Storyboard"></select>
        <button class="btn icon" id="newDoc" title="New">+</button>
        <button class="btn icon" id="renameDoc" title="Rename">✎</button>
        <button class="btn icon" id="deleteDoc" title="Delete">🗑</button>
      </div>
      <div class="config">
        <span>Total</span>
        <input id="totalSec" type="number" min="5" step="5" value="60" />
        <span>s · per frame</span>
        <input id="frameSec" type="number" min="1" step="1" value="5" />
        <span>s</span>
        <button class="btn ghost" id="applyTiming">Reset</button>
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="section">
      <button class="btn" id="settingsBtn" title="API keys & voice">⚙ API keys</button>
    </div>

    <div class="section-divider"></div>

    <div class="section music">
      <span class="label-mono">Soundtrack</span>
      <div class="wave-mini" id="musicWave">
        <div class="placeholder">No track yet. Write a prompt, then Generate.</div>
      </div>
      <div class="row" id="musicControls" style="display:none">
        <button class="btn tiny" id="musicPlayPause" title="Play/Pause">▶ Play</button>
        <button class="btn tiny" id="musicStop" title="Stop">⏹</button>
        <button class="btn tiny" id="musicRestart" title="Restart">↻</button>
        <span class="music-time" id="musicTime">0:00 / 0:00</span>
      </div>
      <div class="row" id="musicSecondary" style="display:none">
        <button class="btn tiny" id="clearMusic">Clear track</button>
      </div>
      <button class="btn primary" id="genMusic">⚡ Generate</button>
      <textarea id="musicPrompt" placeholder="Cinematic ambient, slow strings, melancholic… (describe genre, mood, instruments, tempo)"></textarea>
      <audio id="musicAudio" preload="metadata"></audio>
    </div>
  </aside>

  <main>
    <div class="main-actions">
      <button class="btn primary" id="playBtn">▶ Play</button>
      <button class="btn" id="shareBtn">↗ Share link</button>
      <button class="btn" id="downloadBtn">⬇ Download MP4 (2K)</button>
    </div>
    <div class="editor">
      <div id="frames" class="frames"></div>
      <div class="add-row">
        <button class="btn" id="addFrame" title="Add a new frame (⌘↩ / Ctrl+Enter)">+ Add frame <span class="kbd-hint">⌘↩</span></button>
      </div>
      <div class="summary">
        <div id="summaryLeft">0 frames</div>
        <div id="summaryRight">0s total</div>
      </div>
    </div>
  </main>
</div>

<div class="player" id="player" style="display:none">
  <div class="stage">
    <div class="img-stage" id="playerImgStage"><video id="playerVideo" muted loop playsinline></video></div>
    <div class="frameno" id="playerFrameNo"></div>
    <button class="btn close" id="closeBtn">Close ✕</button>
    <div class="description" id="playerDesc"></div>

  function blankDoc() {
    const totalSec = 60, frameSec = 5;
    const count = Math.round(totalSec / frameSec);
    return {
      totalSec, frameSec,
      musicKey: "", musicPrompt: "",
      frames: Array.from({length: count}, () => makeFrame(frameSec))

  function makeFrame(duration) {
    return { description:"", subtitle:"", duration, imageKey:"", imageHistory:[], mediaTypes:{}, audioKey:"", wave:[] };

  // --- IndexedDB for binary blobs ---
  let _dbPromise = null;
  function db() {
    if (_dbPromise) return _dbPromise;
    _dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open("storyboard-assets", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("blobs");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return _dbPromise;
  }
  async function idbPut(key, blob) {
    const d = await db();
    return new Promise((resolve, reject) => {
      const tx = d.transaction("blobs", "readwrite");
      tx.objectStore("blobs").put(blob, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key) {
    if (!key) return null;
    const d = await db();
    return new Promise((resolve, reject) => {
      const tx = d.transaction("blobs", "readonly");
      const req = tx.objectStore("blobs").get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbDel(key) {
    if (!key) return;
    const d = await db();
    return new Promise((resolve, reject) => {
      const tx = d.transaction("blobs", "readwrite");
      tx.objectStore("blobs").delete(key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  const _blobUrls = new Map();
  async function blobUrl(key) {
    if (!key) return "";
    if (_blobUrls.has(key)) return _blobUrls.get(key);
    const blob = await idbGet(key);
    if (!blob) return "";
    const url = URL.createObjectURL(blob);
    _blobUrls.set(key, url);
    return url;
  }
  function dataUrlToBlob(dataUrl) { return fetch(dataUrl).then(r => r.blob()); }
  function newKey(prefix) { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`; }
  function uniqueName(base) {
    if (!store.docs[base]) return base;
    let i = 2;
    while (store.docs[`${base} ${i}`]) i++;
    return `${base} ${i}`;
  }
  function activeDoc() { return store.docs[store.active]; }

  // --- persistence ---
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    catch (e) {
      console.warn("storage full", e);
      alert("Storage full — try clearing generated assets or deleting an old storyboard.");
    }
  }
  function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
  function loadSettings() {
    try { const raw = localStorage.getItem(SETTINGS_KEY); if (raw) Object.assign(settings, JSON.parse(raw)); } catch {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && data.docs && data.active && data.docs[data.active]) {
          store = data;
          for (const k of Object.keys(store.docs)) {
            const d = store.docs[k];
            if (d.musicKey == null) d.musicKey = "";
            if (d.musicPrompt == null) d.musicPrompt = "";
            for (const f of d.frames) {
              if (f.imageKey == null) f.imageKey = "";
              if (f.audioKey == null) f.audioKey = "";
              if (f.wave == null) f.wave = [];
              if (!Array.isArray(f.imageHistory)) f.imageHistory = f.imageKey ? [f.imageKey] : [];
              else if (f.imageKey && !f.imageHistory.includes(f.imageKey)) f.imageHistory.push(f.imageKey);
              if (!f.mediaTypes || typeof f.mediaTypes !== "object") f.mediaTypes = {};
            }
          }
          return true;
        }
      }
    } catch {}
    return false;
  }

  async function migrateInlineToIdb() {
    let changed = false;
    for (const docName of Object.keys(store.docs)) {
      const d = store.docs[docName];
      if (d.music && typeof d.music === "string" && d.music.startsWith("data:")) {
        try {
          const blob = await dataUrlToBlob(d.music);
          const key = newKey("music");
          await idbPut(key, blob);
          d.musicKey = key;
        } catch (e) { console.warn("music migration failed", e); }
        delete d.music; changed = true;
      }
      for (const f of d.frames) {
        if (f.image && typeof f.image === "string" && f.image.startsWith("data:")) {
          try {
            const blob = await dataUrlToBlob(f.image);
            const key = newKey("img");
            await idbPut(key, blob);
            f.imageKey = key;
          } catch (e) { console.warn("image migration failed", e); }
          delete f.image; changed = true;
        }
        if (f.audio && typeof f.audio === "string" && f.audio.startsWith("data:")) {
          try {
            const blob = await dataUrlToBlob(f.audio);
            const key = newKey("audio");
            await idbPut(key, blob);
            f.audioKey = key;
          } catch (e) { console.warn("audio migration failed", e); }
          delete f.audio; changed = true;
        }
      }
    }
    if (changed) save();
  }

  // --- helpers ---
  function escapeHtml(s) {
    return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function formatTime(s) {
    const rounded = Math.round(s);
    const m = Math.floor(rounded/60); const r = rounded%60;
    return `${m}:${String(r).padStart(2,"0")}`;
  }
  function formatSecsShort(s) {
    if (s % 1 === 0) return String(s);
    return s.toFixed(2).replace(/\.?0+$/, "");
  }
  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }
  async function blobToCompressedBlob(srcBlob, maxWidth = 1280, quality = 0.85) {
    const img = new Image();
    const objUrl = URL.createObjectURL(srcBlob);
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = objUrl; });
    const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
    const w = Math.round(img.width * ratio);
    const h = Math.round(img.height * ratio);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(objUrl);
    return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
  }
  async function urlToCompressedBlob(url, maxWidth = 1280, quality = 0.85) {
    const res = await fetch(url);
    const blob = await res.blob();
    return blobToCompressedBlob(blob, maxWidth, quality);
  }
  async function fetchImageWithFallback(url) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.blob();
    } catch {}
    // Fall back to routing through the BFL Worker (it accepts any upstream via __upstream)
    if (settings.bflProxyUrl) {
      try {
        const u = new URL(url);
        const sep = u.search ? "&" : "?";
        const proxied = `${settings.bflProxyUrl}${u.pathname}${u.search}${sep}__upstream=${u.host}`;
        const res = await fetch(proxied);
        if (res.ok) return await res.blob();
      } catch {}
    }
    throw new Error(`Could not fetch ${url}`);
  }

  const TMDB_STOPWORDS = new Set(("the and that with from this they have been will what when where which their there about into over under " +
    "after before some only just also more most than then through while like very much such even your shot wide close pull " +
    "scene frame still image picture view angle camera").split(/\s+/));

  function extractKeywords(description, max = 5) {
    const words = (description.toLowerCase().match(/[a-z]+/g) || [])
      .filter(w => w.length >= 4 && !TMDB_STOPWORDS.has(w));
    const seen = new Set(); const out = [];
    for (const w of words) {
      if (seen.has(w)) continue;
      seen.add(w); out.push(w);
      if (out.length >= max) break;
    }
    return out;
  }

  async function tmdbGet(path) {
    const sep = path.includes("?") ? "&" : "?";
    const res = await fetch(`https://api.themoviedb.org/3${path}${sep}api_key=${settings.tmdbKey}`);
    if (!res.ok) throw new Error(`TMDb ${res.status}`);
    return res.json();
  }

  async function searchMovieStills(description, max = 3) {
    if (!settings.tmdbKey || !description.trim()) return [];
    const urls = [];
    const seen = new Set();
    const pushUrl = (path) => {
      if (!path) return;
      const u = `https://image.tmdb.org/t/p/w1280${path}`;
      if (!seen.has(u)) { seen.add(u); urls.push(u); }
    };

    try {
      // 1) Multi-search (works if description happens to contain a title or strong proper noun)
      try {
        const q = encodeURIComponent(description.trim().slice(0, 200));
        const data = await tmdbGet(`/search/multi?query=${q}&include_adult=false&page=1`);
        for (const r of (data.results || [])) {
          if (urls.length >= max) break;
          if ((r.media_type === "movie" || r.media_type === "tv") && r.backdrop_path) pushUrl(r.backdrop_path);
        }
      } catch (e) { console.warn("multi-search skipped", e.message); }

      // 2) Keyword-driven discover — the real workhorse for scene descriptions
      if (urls.length < max) {
        const keywords = extractKeywords(description, 5);
        console.log("TMDb keyword candidates:", keywords);
        for (const word of keywords) {
          if (urls.length >= max) break;
          try {
            const kw = await tmdbGet(`/search/keyword?query=${encodeURIComponent(word)}&page=1`);
            const top = (kw.results || []).slice(0, 2);
            for (const k of top) {
              if (urls.length >= max) break;
              try {
                const disc = await tmdbGet(`/discover/movie?with_keywords=${k.id}&sort_by=vote_average.desc&vote_count.gte=100&page=1`);
                for (const m of (disc.results || [])) {
                  if (urls.length >= max) break;
                  if (m.backdrop_path) pushUrl(m.backdrop_path);
                }
              } catch (e) { console.warn("discover failed for keyword", word, e.message); }
            }
          } catch (e) { console.warn("keyword lookup failed", word, e.message); }
        }
      }

      // 3) Last resort: pull popular movie backdrops so at least something cinematic lands in the catalogue
      if (urls.length === 0) {
        try {
          const pop = await tmdbGet(`/movie/popular?page=1`);
          for (const m of (pop.results || [])) {
            if (urls.length >= max) break;
            if (m.backdrop_path) pushUrl(m.backdrop_path);
          }
        } catch (e) { console.warn("popular fallback failed", e.message); }
      }

      console.log(`TMDb returning ${urls.length} still URL(s)`);
      return urls.slice(0, max);
    } catch (e) {
      console.warn("TMDb search failed", e);
      return [];
    }
  }
  async function computeWaveform(blob, bins = 96) {
    const buf = await blob.arrayBuffer();
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ac = new Ctx();
    const decoded = await ac.decodeAudioData(buf.slice(0));
    const ch = decoded.getChannelData(0);
    const duration = decoded.duration;
    const samplesPerBin = Math.floor(ch.length / bins);
    const peaks = [];
    let globalMax = 0;
    for (let i = 0; i < bins; i++) {
      let max = 0;
      const start = i * samplesPerBin;
      const end = start + samplesPerBin;
      for (let j = start; j < end; j++) {
        const v = Math.abs(ch[j]);
        if (v > max) max = v;
      }
      peaks.push(max);
      if (max > globalMax) globalMax = max;
    }
    if (globalMax > 0) for (let i = 0; i < peaks.length; i++) peaks[i] /= globalMax;
    ac.close();
    return { peaks, duration };
  }
  function drawWaveform(canvas, peaks) {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0) { requestAnimationFrame(() => drawWaveform(canvas, peaks)); return; }
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, rect.width, rect.height);
    if (!peaks || peaks.length === 0) return;
    const mid = rect.height / 2;
    const barWidth = rect.width / peaks.length;
    const barPad = Math.max(0.5, barWidth * 0.25);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#4d7c5a";
    peaks.forEach((p, i) => {
      const h = Math.max(1, p * (rect.height - 4));
      ctx.fillRect(i * barWidth + barPad/2, mid - h/2, Math.max(1, barWidth - barPad), h);
    });
  }

  // --- render ---
  const framesEl = document.getElementById("frames");
  const summaryLeft = document.getElementById("summaryLeft");
  const summaryRight = document.getElementById("summaryRight");
  const docSelect = document.getElementById("docSelect");

  function renderDocPicker() {
    docSelect.innerHTML = "";
    Object.keys(store.docs).sort().forEach(name => {
      const opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      if (name === store.active) opt.selected = true;
      docSelect.appendChild(opt);
    });
  }

  function fmtSec(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s/60), r = Math.floor(s%60);
    return `${m}:${String(r).padStart(2,"0")}`;
  }
  function updateMusicTime() {
    const a = document.getElementById("musicAudio");
    document.getElementById("musicTime").textContent = `${fmtSec(a.currentTime || 0)} / ${fmtSec(a.duration || 0)}`;
    const overlay = document.querySelector("#musicWave .progress-overlay");
    if (overlay && a.duration) overlay.style.width = `${(a.currentTime / a.duration) * 100}%`;
  }
  function renderMusic() {
    const doc = activeDoc();
    document.getElementById("musicPrompt").value = doc.musicPrompt || "";
    const mc = document.getElementById("musicControls");
    const ms = document.getElementById("musicSecondary");
    const mw = document.getElementById("musicWave");
    const audio = document.getElementById("musicAudio");
    mw.innerHTML = "";
    if (doc.musicKey) {
      const c = document.createElement("canvas");
      mw.appendChild(c);
      const overlay = document.createElement("div");
      overlay.className = "progress-overlay";
      mw.appendChild(overlay);
      mw.classList.add("has-audio");
      mc.style.display = "flex";
      ms.style.display = "flex";
      idbGet(doc.musicKey).then(async b => {
        if (!b) return;
        const url = await blobUrl(doc.musicKey);
        audio.src = url;
        const { peaks } = await computeWaveform(b, 200);
        drawWaveform(c, peaks);
        audio.addEventListener("loadedmetadata", updateMusicTime, { once: true });
      }).catch(()=>{});
      document.getElementById("musicPlayPause").textContent = audio.paused ? "▶ Play" : "⏸ Pause";
    } else {
      mw.classList.remove("has-audio");
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "No track yet. Write a prompt, then Generate.";
      mw.appendChild(ph);
      mc.style.display = "none";
      ms.style.display = "none";
      audio.removeAttribute("src");
    }
  }

  function mediaTypeFor(f, key) {
    return (f.mediaTypes && f.mediaTypes[key]) || "image/jpeg";
  }
  function isVideoType(t) { return typeof t === "string" && t.startsWith("video/"); }

  function frameImageHtml(f) {
    if (!f.imageKey) {
      return `<div class="placeholder">Write description<br>→ Generate or upload</div>`;
    }
    const history = Array.isArray(f.imageHistory) ? f.imageHistory : [];
    const idx = history.indexOf(f.imageKey);
    const total = history.length;
    const counter = total > 1 ? `
      <div class="img-counter">
        <button data-action="prev-image" title="Previous version" ${idx<=0?"disabled":""}>‹</button>
        <span class="count">${idx+1} / ${total}</span>
        <button data-action="next-image" title="Next version" ${idx>=total-1?"disabled":""}>›</button>
      </div>` : "";
    const type = mediaTypeFor(f, f.imageKey);
    const mediaEl = isVideoType(type)
      ? `<video data-key="${f.imageKey}" muted loop autoplay playsinline></video>`
      : `<img alt="" data-key="${f.imageKey}" />`;
    return `${mediaEl}${counter}<div class="corner"><button data-action="clear-image" title="Delete this version">×</button></div>`;
  }
  function hydrateImages(root) {
    root.querySelectorAll('img[data-key],video[data-key]').forEach(el => {
      const key = el.dataset.key;
      blobUrl(key).then(url => { if (url) el.src = url; });
    });
  }

  function renderEditor() {
    const sy = window.scrollY;
    const doc = activeDoc();
    framesEl.innerHTML = "";
    let t = 0;
    doc.frames.forEach((f, i) => {
      const start = t; t += f.duration;
      const row = document.createElement("div");
      row.className = "frame";
      row.dataset.frameIdx = i;
      row.innerHTML = `
        <div class="frame-head">
          <span class="grip" draggable="true" data-frame-idx="${i}" title="Drag to reorder">⋮⋮</span>
          <span class="num">#${String(i+1).padStart(2,"0")}</span>
          <span>${formatTime(start)} – ${formatTime(start + f.duration)}</span>
          <span class="spacer"></span>
          <span class="dur">
            <input type="number" min="0.1" step="0.1" data-i="${i}" data-k="duration" value="${formatSecsShort(f.duration)}" title="${f.audioKey ? 'Auto-set from voiceover length. Clear voiceover to edit.' : 'Seconds'}" ${f.audioKey ? "readonly" : ""} />
            <span>sec${f.audioKey ? " · auto" : ""}</span>
          </span>
          <button class="remove" data-action="remove" data-i="${i}" title="Remove frame">×</button>
        </div>
        <div class="frame-body">
          <div class="col">
            <div class="img-preview" data-img="${i}">${frameImageHtml(f)}</div>
            <div class="col-head">
              <label>What you see</label>
              <div class="col-head-actions">
                <button class="btn tiny" data-action="upload-image" data-i="${i}" title="Upload image">⬆ Upload</button>
                <button class="btn tiny" data-action="gen-image" data-i="${i}">⚡ Generate</button>
              </div>
            </div>
            <textarea rows="4" data-i="${i}" data-k="description" placeholder="A wide shot of an empty diner at dusk, neon humming…"></textarea>
          </div>
          <div class="col">
            <div class="wave-preview" data-wave="${i}"><canvas></canvas></div>
            <div class="wave-controls" data-wavectl="${i}" style="display:${f.audioKey ? "flex" : "none"}">
              <button class="btn tiny" data-action="play-audio" data-i="${i}">▶ Preview</button>
              <button class="btn tiny" data-action="clear-audio" data-i="${i}">Clear</button>
            </div>
            <div class="col-head">
              <label>What you hear</label>
              <button class="btn tiny" data-action="gen-voice" data-i="${i}">⚡ Generate</button>
            </div>
            <textarea rows="4" data-i="${i}" data-k="subtitle" placeholder="Some places remember you, even when no one's there."></textarea>
          </div>
        </div>
      `;
      row.querySelector('[data-k="description"]').value = f.description;
      row.querySelector('[data-k="subtitle"]').value = f.subtitle;
      framesEl.appendChild(row);
      const canvas = row.querySelector(`[data-wave="${i}"] canvas`);
      drawWaveform(canvas, f.wave);
      if (!f.wave || f.wave.length === 0) {
        canvas.style.display = "none";
        const ph = document.createElement("div");
        ph.className = "placeholder";
        ph.textContent = "Write voiceover → Generate";
        row.querySelector(`[data-wave="${i}"]`).appendChild(ph);
      }
    });
    const total = doc.frames.reduce((s,f)=>s+f.duration, 0);
    summaryLeft.textContent = `${doc.frames.length} frame${doc.frames.length===1?"":"s"} · ${store.active}`;
    summaryRight.textContent = `${total}s total`;

  }

  // Localized re-render of just one frame's image preview (so prev/next/upload
  // don't rebuild the whole grid and trigger scroll clamping).
  function updateFrameImage(i) {
    const f = activeDoc().frames[i];
    const preview = document.querySelector(`[data-img="${i}"]`);

    preview.innerHTML = frameImageHtml(f);

  // --- event wiring ---
  // --- drag-and-drop frame reordering ---
  let dragSrcIdx = null;
  framesEl.addEventListener("dragstart", e => {
    const grip = e.target.closest(".grip");
    if (!grip) { e.preventDefault(); return; }
    const frame = grip.closest(".frame");
    dragSrcIdx = parseInt(frame.dataset.frameIdx, 10);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(dragSrcIdx));
    e.dataTransfer.setDragImage(frame, 20, 20);
    frame.classList.add("dragging");
  });
  function isFileDrag(e) {
    const types = e.dataTransfer && e.dataTransfer.types;
    return !!(types && Array.from(types).includes("Files"));
  }
  framesEl.addEventListener("dragover", e => {
    // File drag from desktop onto image preview
    if (dragSrcIdx === null && isFileDrag(e)) {
      const imgPreview = e.target.closest(".img-preview");
      if (imgPreview) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        framesEl.querySelectorAll(".img-preview.drag-over-file").forEach(el => {
          if (el !== imgPreview) el.classList.remove("drag-over-file");
        });
        imgPreview.classList.add("drag-over-file");
      }
      return;
    }
    if (dragSrcIdx === null) return;
    // Frame reorder via grip
    const frame = e.target.closest(".frame");
    if (!frame) return;
    e.preventDefault();
    const rect = frame.getBoundingClientRect();
    const before = e.clientX < rect.left + rect.width / 2;
    framesEl.querySelectorAll(".frame").forEach(f => f.classList.remove("drop-before","drop-after"));
    frame.classList.toggle("drop-before", before);
    frame.classList.toggle("drop-after", !before);
  });
  framesEl.addEventListener("dragleave", e => {
    if (!e.target.closest(".frames")) {
      framesEl.querySelectorAll(".frame").forEach(f => f.classList.remove("drop-before","drop-after"));
      framesEl.querySelectorAll(".img-preview.drag-over-file").forEach(el => el.classList.remove("drag-over-file"));
    } else {
      // If leaving an image preview, drop its highlight
      const left = e.target.closest && e.target.closest(".img-preview");
      const entered = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".img-preview");
      if (left && left !== entered) left.classList.remove("drag-over-file");
    }
  });
  framesEl.addEventListener("drop", async e => {
    // File drop onto image preview
    if (dragSrcIdx === null && isFileDrag(e)) {
      const imgPreview = e.target.closest(".img-preview");
      if (!imgPreview) return;
      e.preventDefault();
      imgPreview.classList.remove("drag-over-file");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) { alert("That doesn't look like an image or video file."); return; }
      const frameIdx = parseInt(imgPreview.dataset.img, 10);
      await handleImageUpload(frameIdx, file);
      return;
    }
    if (dragSrcIdx === null) return;
    // Frame reorder drop
    const frame = e.target.closest(".frame");
    if (!frame) return;
    e.preventDefault();
    const dropIdx = parseInt(frame.dataset.frameIdx, 10);
    const rect = frame.getBoundingClientRect();
    const before = e.clientX < rect.left + rect.width / 2;
    let insertAt = before ? dropIdx : dropIdx + 1;
    if (insertAt > dragSrcIdx) insertAt -= 1;
    if (insertAt === dragSrcIdx) { cleanupDrag(); return; }
    const doc = activeDoc();
    const [moved] = doc.frames.splice(dragSrcIdx, 1);
    doc.frames.splice(insertAt, 0, moved);
    save(); renderEditor();
    cleanupDrag();
  });
  framesEl.addEventListener("dragend", cleanupDrag);
  function cleanupDrag() {
    dragSrcIdx = null;
    framesEl.querySelectorAll(".frame").forEach(f =>

    let i = btn.dataset.i;
    if (i == null && wrap) i = wrap.dataset.img || wrap.dataset.wave;
    i = +i;

    if (action === "remove") {
      doc.frames.splice(i, 1);

      if (idx > 0) { f.imageKey = history[idx - 1]; save(); updateFrameImage(i); }
    } else if (action === "next-image") {
      const f = doc.frames[i];
      const history = Array.isArray(f.imageHistory) ? f.imageHistory : [];
      const idx = history.indexOf(f.imageKey);
      if (idx >= 0 && idx < history.length - 1) { f.imageKey = history[idx + 1]; save(); updateFrameImage(i); }
    } else if (action === "clear-image") {
      const f = doc.frames[i];
      const history = Array.isArray(f.imageHistory) ? f.imageHistory : [];
      const idx = history.indexOf(f.imageKey);
      const deletedKey = f.imageKey;
      if (deletedKey) idbDel(deletedKey).catch(()=>{});
      if (idx >= 0) history.splice(idx, 1);
      f.imageHistory = history;

      f.imageKey = history.length > 0 ? history[Math.min(idx, history.length - 1)] : "";
